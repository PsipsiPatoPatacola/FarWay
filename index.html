
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #170522;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
  transition: background 0.7s;
}

/* FUNDO COM AS FOTOS */
#fundoFotos {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

#fundoFotos img {
  position: absolute;
  width: min(42vw, 340px);
  height: 25vh;
  object-fit: cover;
  border-radius: 22px;
  opacity: 0.76;
  filter: drop-shadow(0 0 15px rgba(255,255,255,0.24));
  border: 2px solid rgba(255,255,255,0.25);
}

/* Posições das fotos no fundo */
#fundoFotos img:nth-child(1) {
  top: 5%;
  left: -5%;
  transform: rotate(-8deg);
}

#fundoFotos img:nth-child(2) {
  top: 13%;
  right: -5%;
  transform: rotate(7deg);
}

#fundoFotos img:nth-child(3) {
  top: 37%;
  left: -7%;
  transform: rotate(6deg);
}

#fundoFotos img:nth-child(4) {
  top: 43%;
  right: -7%;
  transform: rotate(-7deg);
}

#fundoFotos img:nth-child(5) {
  top: 70%;
  left: -3%;
  transform: rotate(-6deg);
}

#fundoFotos img:nth-child(6) {
  top: 75%;
  right: -3%;
  transform: rotate(8deg);
}

#fundoFotos img:nth-child(7) {
  top: 88%;
  left: 30%;
  transform: rotate(-4deg);
}

#fundoFotos img:nth-child(8) {
  top: 28%;
  left: 35%;
  transform: rotate(5deg);
}

#fundoFotos img:nth-child(9) {
  top: 58%;
  left: 35%;
  transform: rotate(-5deg);
}

#fundoFotos img:nth-child(10) {
  top: 92%;
  right: 20%;
  transform: rotate(5deg);
}

/* Escurece levemente as fotos para o texto aparecer */
#sombraFundo {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: rgba(0,0,0,0.40);
  pointer-events: none;
}

/* CONTEÚDO */
#app {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  margin: auto;
  padding: 45px 20px 70px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

h1 {
  width: min(100%, 720px);
  padding: 20px 16px;
  margin: 15px 0 55px;
  font-size: clamp(27px, 6vw, 43px);
  line-height: 1.3;
  background: rgba(31,0,53,0.78);
  border: 2px solid #a52cff;
  border-radius: 30px;
  box-shadow: 0 0 18px #9c27ff;
  text-shadow: 0 0 12px #d66aff;
}

/* MENSAGEM SEM CAIXA */
#mensagem {
  width: min(100%, 760px);
  padding: 12px 10px;
  margin: 35px auto 35px;
  font-family: "Segoe Script", "Brush Script MT", cursive;
  font-size: clamp(21px, 5vw, 30px);
  line-height: 1.65;
  white-space: pre-line;
  color: #fff4ff;
  text-shadow:
    0 2px 5px #000,
    0 0 10px #000,
    0 0 18px rgba(190,80,255,0.85);
}

#mensagem:empty {
  display: none;
}

/* BOTÕES */
#opcoes {
  width: min(100%, 620px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0 auto 25px;
}

button {
  border: 2px solid #cf36ff;
  border-radius: 25px;
  padding: 16px 18px;
  min-height: 66px;
  font-size: clamp(17px, 4vw, 23px);
  color: white;
  background: rgba(55,5,91,0.91);
  box-shadow: 0 0 12px rgba(190,35,255,0.65);
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  background: rgba(105,15,150,0.96);
  box-shadow: 0 0 22px #d52cff;
  transform: scale(1.02);
}

button:active {
  transform: scale(0.98);
}

#campo {
  width: min(100%, 550px);
  min-height: 140px;
  padding: 14px;
  border: 2px solid #c52cff;
  border-radius: 15px;
  background: rgba(255,255,255,0.96);
  color: #24102d;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  margin-bottom: 15px;
}

#enviarTexto {
  display: none;
}

#status {
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 5px black;
}

/* CORES DE CADA PARTE */
body.anakin {
  background: #171717;
}

body.melissa {
  background: #260044;
}

body.cigana {
  background: #6b2b05;
}

body.familia {
  background: #21120c;
}

body.vermelho {
  background: #650b24;
}

body.anakin #sombraFundo {
  background: rgba(0,0,0,0.38);
}

body.melissa #sombraFundo {
  background: rgba(35,0,65,0.35);
}

body.cigana #sombraFundo {
  background: rgba(75,25,0,0.36);
}

body.familia #sombraFundo {
  background: rgba(20,10,5,0.40);
}

/* BOTÃO DE VOLTAR */
.voltar {
  margin-top: 30px;
  width: min(100%, 620px);
}

/* SNOOPY DA PARTE ANTIGA */
#snoopy {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
  gap: 10px;
  width: 100%;
  margin: 15px 0;
}

#snoopy:empty {
  display: none;
}

#snoopy img {
  width: 100%;
  height: 115px;
  object-fit: contain;
  animation: flutuar 3s ease-in-out infinite;
  filter: drop-shadow(0 0 7px rgba(194,60,255,0.55));
}

@keyframes flutuar {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-8px) rotate(2deg); }
}

@media (max-width: 600px) {
  #app {
    padding: 35px 20px 60px;
  }

  #fundoFotos img {
    width: 48vw;
    height: 20vh;
    opacity: 0.72;
  }

  #mensagem {
    font-size: clamp(20px, 5.5vw, 27px);
    line-height: 1.65;
    margin-top: 30px;
  }

  h1 {
    margin-bottom: 40px;
  }
}
</style>
</head>

<body>

<div id="fundoFotos"></div>
<div id="sombraFundo"></div>

<div id="app">

  <h1 id="pergunta">Espero que goste independente das escolhas</h1>

  <div id="snoopy"></div>

  <p id="mensagem"></p>

  <div id="opcoes"></div>

  <textarea id="campo"
    placeholder="Escreva sua resposta..."
    style="display:none"></textarea>

  <button id="enviarTexto">Enviar resposta</button>

  <p id="status"></p>

</div>

<audio id="musica" src="musica.mp3" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const opcoes = document.getElementById("opcoes");
const snoopy = document.getElementById("snoopy");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");
const fundoFotos = document.getElementById("fundoFotos");

function registrar(perguntaFeita, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      pergunta: perguntaFeita,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

function limpar() {
  opcoes.innerHTML = "";
  snoopy.innerHTML = "";
  fundoFotos.innerHTML = "";
  mensagem.textContent = "";
  campo.value = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";
}

function botao(texto, acao, classe = "") {
  const b = document.createElement("button");
  b.textContent = texto;
  if (classe) b.className = classe;
  b.onclick = acao;
  opcoes.appendChild(b);
}

function imagensSnoopy(nomes) {
  snoopy.innerHTML = "";

  nomes.forEach(nome => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Snoopy";
    snoopy.appendChild(img);
  });
}

/* COLOCA AS FOTOS REAIS NO FUNDO */
function fotosDeFundo(nomes) {
  fundoFotos.innerHTML = "";

  nomes.forEach(nome => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "";
    img.onerror = () => {
      img.style.display = "none";
    };
    fundoFotos.appendChild(img);
  });
}

/* ESCOLHA DOS FILHOS */
function etapaFilhos() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "Nossos filhos ❤️";

  mensagem.textContent =
    "Escolha quem você quer ver primeiro.";

  botao("🐈‍⬛ Anakin", () => {
    registrar("Nossos filhos", "Anakin");
    etapaAnakin();
  });

  botao("💜 Melissa", () => {
    registrar("Nossos filhos", "Melissa");
    etapaMelissa();
  });

  botao("🧡 Cigana", () => {
    registrar("Nossos filhos", "Cigana");
    etapaCigana();
  });

  botao("❤️ Nossa família", () => {
    registrar("Nossos filhos", "Nossa família");
    etapaFamilia();
  });

  botao("Voltar", iniciar);
}

/* ANAKIN */
function etapaAnakin() {
  limpar();
  document.body.className = "anakin";

  pergunta.textContent = "Nosso querido Anakin 🖤";

  mensagem.textContent =
    "E em meio ao pouco caos que estávamos em casa com as duas idosas, chegou um capetinha, ou melhor, um porcarinhazinha para agitar e animar nossa vida, o nosso querido filho Anakin que dorme com nós, nos perturba, pula nas nossas calças e vive miando por comida igual um desesperado. Nosso lindo filho 🖤";

  fotosDeFundo([
    "anakin.jpg",
    "anakin1.jpg",
    "anakin2.jpg",
    "anakin3.jpg",
    "anakin4.jpg",
    "anakin5.jpg",
    "anakin6.jpg"
  ]);

  botao("Voltar à escolha dos filhos ❤️", etapaFilhos, "voltar");
}

/* MELISSA */
function etapaMelissa() {
  limpar();
  document.body.className = "melissa";

  pergunta.textContent = "Nossa linda Melissa 💜";

  mensagem.textContent =
    "Esse aqui é a mais manhosa, ansiosa igual ao pai e observadora igual a mãe. Antes mesmo de eu chegar na sua vida, ela já era seu mundo, apenas sou um planeta do sistema solar que continuará dando sentido ao mesmo universo que vc ama. Nossa linda e bela Melissa Mel 💜";

  fotosDeFundo([
    "melissa.jpg",
    "melissa2.jpg",
    "melissa3.jpg",
    "melissa4.jpg",
    "melissa5.jpg"
  ]);

  botao("Voltar à escolha dos filhos ❤️", etapaFilhos, "voltar");
}

/* CIGANA */
function etapaCigana() {
  limpar();
  document.body.className = "cigana";

  pergunta.textContent = "Nossa querida Cigana 🧡";

  mensagem.textContent =
    "Lembro como se fosse ontem o trabalho para gente conseguir adotar ela, colocar ela dentro de casa, fazer ela comer ração, fazer ela ficar dentro de casa, fora as garras dela que rasgou o nosso colchão de ar novinho kkkkkkk ela é nossa filha mais senhora de alma, onde é preguiçosa, come e dorme além de se irritar fácil com agitação do Anakin. Nossa linda bola de pelo laranja que o melhor fato, é vc ser a mãe dela e quis adotar ela cmg mesmo ela sendo mais de idade 🧡";

  fotosDeFundo([
    "cigana.jpg",
    "cigana2.jpg",
    "cigana3.jpg",
    "cigana4.jpg",
    "cigana5.jpg",
    "cigana6.jpg"
  ]);

  botao("Voltar à escolha dos filhos ❤️", etapaFilhos, "voltar");
}

/* FAMÍLIA */
function etapaFamilia() {
  limpar();
  document.body.className = "familia";

  pergunta.textContent = "Nossa família ❤️";

  mensagem.textContent =
    "Aqui estamos nós, a nossa família reunida, cada um de nós somos um planeta nesse universo enquanto VOCÊ Sarah Isabel, é o sol que ilumina a nossa existência. Graças a vc estamos todos ligados diretamente e somos uma família um pouco caótica mas muito feliz e amorosa. Amo muito você, igual amo cada um dos nossos filhos.\n\nE é claro, a nossa Diana terá lindas irmãs e um irmão capeta ❤️";

  fotosDeFundo([
    "nos.jpg",
    "nos2.jpg",
    "nos3.jpg",
    "nos4.jpg",
    "nos5.jpg",
    "nos6.jpg",
    "nos7.jpg",
    "nos8.jpg",
    "nos9.jpg",
    "nos10.jpg"
  ]);

  botao("Voltar à escolha dos filhos ❤️", etapaFilhos, "voltar");
}

/* TELA INICIAL */
function iniciar() {
  limpar();
  document.body.className = "";

  pergunta.textContent =
    "Espero que goste independente das escolhas";

  botao("♡  Nossos filhos", () => {
    registrar(pergunta.textContent, "Nossos filhos");
    etapaFilhos();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    limpar();
    pergunta.textContent = "Entendi. Obrigado por responder.";
  });

  botao("♡  Talvez.", () => {
    registrar(pergunta.textContent, "Talvez");
    etapaTalvez();
  });

  botao("♡  Amo muito e ainda te quero.", () => {
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });
}

/* TALVEZ */
function etapaTalvez() {
  limpar();
  document.body.className = "vermelho";

  pergunta.textContent =
    "Então o que vc quer exatamente e como devo agir?";

  mensagem.textContent =
    "Pois voltar para CG se necessário, eu realmente irei.";

  campo.style.display = "block";
  enviarTexto.style.display = "inline-block";

  enviarTexto.onclick = () => {
    const resposta = campo.value.trim();

    if (!resposta) {
      status.textContent = "Escreva sua resposta primeiro.";
      return;
    }

    registrar(pergunta.textContent, resposta);

    campo.style.display = "none";
    enviarTexto.style.display = "none";
    opcoes.innerHTML = "";

    pergunta.textContent = "Obrigado por me responder.";
    mensagem.textContent = resposta;
    status.textContent = "Resposta enviada ❤️";
  };
}

/* GRAVIDEZ */
function etapaGravidez() {
  limpar();
  document.body.className = "";

  musica.currentTime = 0;
  musica.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  pergunta.textContent = "Vc quer que esteja grávida?";

  botao("♡  Sim, quero muito", () => {
    registrar(pergunta.textContent, "Sim, quero muito");
    etapaFinal();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    musica.pause();
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

/* FINAL DA PARTE DA DIANA */
function etapaFinal() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "❤️";

  mensagem.textContent =
    "Então se cuide direito, coma por duas, beba água por duas, " +
    "tenha cuidado mental por duas. Estarei indo cuidar de você " +
    "e cuidar da Diana, errei em muitas coisas, eu sei, mas também " +
    "sei o quão te amo e o quanto quero que você seja a mãe da Diana, " +
    "pois uma bebezinha com o seu rosto será tão perfeita quanto você. " +
    "E vc será a mais incrível desse mundo enquanto cuidamos dela " +
    "desde cedo para irmos pro Canadá. Então, se cuidar pelas duas " +
    "e me espere que estou indo.";

  imagensSnoopy([
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png"
  ]);
}

iniciar();
</script>

</body>
</html>
