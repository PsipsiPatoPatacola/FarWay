<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #190c2c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  transition: background 0.7s;
}

/* Snoopy espalhados pelo fundo */
#snoopy {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

#snoopy img {
  position: absolute;
  width: clamp(75px, 22vw, 145px);
  height: 125px;
  object-fit: contain;
  opacity: 0.75;
  animation: subir linear infinite;
}

@keyframes subir {
  from {
    transform: translateY(110vh) rotate(-5deg);
  }
  to {
    transform: translateY(-160px) rotate(5deg);
  }
}

/* Pergunta, mensagem e botões ficam na frente */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  margin: auto;
  padding: 30px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  font-size: clamp(28px, 6vw, 46px);
  margin: 15px 0;
}

#mensagem {
  max-width: 760px;
  font-size: clamp(18px, 4vw, 25px);
  line-height: 1.6;
  white-space: pre-line;
}

#opcoes {
  width: min(100%, 450px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 20px 0;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 15px 20px;
  font-size: 17px;
  color: white;
  background: #7838b8;
  cursor: pointer;
}

button:hover {
  background: #9b5de5;
}

#campo {
  width: min(100%, 550px);
  min-height: 140px;
  padding: 14px;
  border-radius: 12px;
  font: inherit;
  font-size: 17px;
  resize: vertical;
}

.vermelho {
  background: #8b101e;
}

#status {
  font-size: 14px;
  opacity: 0.8;
}
</style>
</head>

<body>

<!-- Fundo animado dos Snoopy -->
<div id="snoopy"></div>

<div id="app">
  <h1 id="pergunta">Oi, vc ainda me ama?</h1>
  <p id="mensagem"></p>
  <div id="opcoes"></div>

  <textarea id="campo"
    placeholder="Escreva sua resposta..."
    style="display:none"></textarea>

  <button id="enviarTexto" style="display:none">
    Enviar resposta
  </button>

  <p id="status"></p>
</div>

<audio id="musica" src="musica.mp3" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const opcoes = document.getElementById("opcoes");
const snoopy = document.getElementById("snoopy");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");

function registrar(pergunta, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      pergunta: pergunta,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

function limpar() {
  opcoes.innerHTML = "";
  snoopy.innerHTML = "";
  mensagem.textContent = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";
}

function botao(texto, acao) {
  const b = document.createElement("button");
  b.textContent = texto;
  b.onclick = acao;
  opcoes.appendChild(b);
}

/* Coloca os Snoopy em posições variadas e anima cada um */
function imagens(nomes) {
  snoopy.innerHTML = "";

  const posicoes = [
    { left: "2%", top: "5%" },
    { left: "78%", top: "10%" },
    { left: "4%", top: "42%" },
    { left: "82%", top: "48%" },
    { left: "28%", top: "2%" },
    { left: "62%", top: "25%" },
    { left: "12%", top: "72%" },
    { left: "76%", top: "78%" },
    { left: "42%", top: "82%" },
    { left: "55%", top: "60%" },
    { left: "88%", top: "30%" },
    { left: "20%", top: "25%" }
  ];

  nomes.forEach((nome, i) => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Snoopy";

    const pos = posicoes[i % posicoes.length];
    img.style.left = pos.left;
    img.style.top = pos.top;
    img.style.animationDuration = `${16 + (i % 5) * 3}s`;
    img.style.animationDelay = `${-i * 2}s`;

    snoopy.appendChild(img);
  });
}

function iniciar() {
  document.body.className = "";
  limpar();

  pergunta.textContent = "Oi, vc ainda me ama?";

  botao("Sim.", () => {
    registrar(pergunta.textContent, "Sim");
    etapaSim();
  });

  botao("Não.", () => {
    registrar(pergunta.textContent, "Não");
    limpar();
    pergunta.textContent = "Entendi. Obrigado por responder.";
  });

  botao("Talvez.", () => {
    registrar(pergunta.textContent, "Talvez");
    etapaTalvez();
  });

  botao("Amo muito e ainda te quero.", () => {
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });

  /* Snoopy aparecem também na tela inicial */
  imagens([
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png",
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-4.png",
    "snoopy-cama.png"
  ]);
}

function etapaSim() {
  limpar();

  pergunta.textContent = "Eu também te amo ❤️";
  mensagem.textContent = "Você ainda é muito especial para mim.";

  imagens([
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png",
    "snoopy-coracao.png"
  ]);

  botao("Continuar", () => {
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

function etapaTalvez() {
  limpar();
  document.body.className = "vermelho";

  pergunta.textContent =
    "Então o que vc quer exatamente e como devo agir?";

  mensagem.textContent =
    "Pois voltar para CG se necessário, eu realmente irei.";

  campo.style.display = "block";
  enviarTexto.style.display = "inline-block";

  enviarTexto.onclick = () => {
    const resposta = campo.value.trim();

    if (!resposta) {
      status.textContent = "Escreva sua resposta primeiro.";
      return;
    }

    registrar(pergunta.textContent, resposta);

    campo.style.display = "none";
    enviarTexto.style.display = "none";
    opcoes.innerHTML = "";
    pergunta.textContent = "Obrigado por me responder.";
    mensagem.textContent = resposta;
    status.textContent = "Resposta enviada ❤️";
  };
}

function etapaGravidez() {
  limpar();
  document.body.className = "";

  musica.currentTime = 0;
  musica.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  pergunta.textContent = "Vc quer que esteja grávida?";

  botao("Sim, quero muito", () => {
    registrar(pergunta.textContent, "Sim, quero muito");
    etapaFinal();
  });

  botao("Não.", () => {
    registrar(pergunta.textContent, "Não");
    musica.pause();
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

function etapaFinal() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "❤️";

  mensagem.textContent =
    "Então se cuide direito, coma por duas, beba água por duas, " +
    "tenha cuidado mental por duas. Estarei indo cuidar de você " +
    "e cuidar da Diana, errei em muitas coisas, eu sei, mas também " +
    "sei o quão te amo e o quanto quero que você seja a mãe da Diana, " +
    "pois uma bebezinha com o seu rosto será tão perfeita quanto você. " +
    "E vc será a mais incrível desse mundo enquanto cuidamos dela " +
    "desde cedo para irmos pro Canadá. Então, se cuidar pelas duas " +
    "e me espere que estou indo.";

  imagens([
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png",
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png"
  ]);
}

iniciar();
</script>

</body>
</html>
