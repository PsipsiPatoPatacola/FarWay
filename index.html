
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background-color: #170522;
  background-image: url("./fundo-snoopy.png?v=3");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  transition: background-color 0.7s;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(20, 0, 35, 0.25);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: "♡     ✦      ♥       ✧       ♡       ✦";
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-around;
  color: rgba(221, 90, 255, 0.55);
  font-size: 25px;
  text-shadow: 0 0 12px #d52cff, 0 0 24px #9d00ff;
  pointer-events: none;
  z-index: 0;
  animation: brilho 3s ease-in-out infinite alternate;
}

@keyframes brilho {
  from { opacity: 0.35; }
  to { opacity: 0.9; }
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  margin: auto;
  padding: 35px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  width: min(100%, 720px);
  padding: 20px 16px;
  margin: 15px 0 35px;
  font-size: clamp(27px, 6vw, 43px);
  line-height: 1.3;
  background: rgba(31, 0, 53, 0.82);
  border: 2px solid #a52cff;
  border-radius: 30px;
  box-shadow: 0 0 14px #9c27ff,
              inset 0 0 14px rgba(160, 40, 255, 0.2);
  text-shadow: 0 0 12px #d66aff;
}

#mensagem {
  width: min(100%, 760px);
  padding: 18px;
  margin: 10px auto 25px;
  font-size: clamp(18px, 4vw, 24px);
  line-height: 1.6;
  white-space: pre-line;
  background: rgba(22, 0, 38, 0.78);
  border: 1px solid rgba(202, 75, 255, 0.55);
  border-radius: 20px;
  text-shadow: 0 1px 5px black;
  box-shadow: 0 0 15px rgba(164, 35, 255, 0.25);
}

#mensagem:empty {
  display: none;
}

#opcoes {
  width: min(100%, 620px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0 auto 20px;
}

button {
  border: 2px solid #cf36ff;
  border-radius: 25px;
  padding: 16px 18px;
  min-height: 66px;
  font-size: clamp(17px, 4vw, 23px);
  color: white;
  background: rgba(55, 5, 91, 0.91);
  box-shadow: 0 0 12px rgba(190, 35, 255, 0.65),
              inset 0 0 10px rgba(190, 35, 255, 0.15);
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  background: rgba(105, 15, 150, 0.96);
  box-shadow: 0 0 22px #d52cff;
  transform: scale(1.02);
}

button:active {
  transform: scale(0.98);
}

#campo {
  width: min(100%, 550px);
  min-height: 140px;
  padding: 14px;
  border: 2px solid #c52cff;
  border-radius: 15px;
  background: rgba(255,255,255,0.96);
  color: #24102d;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  margin-bottom: 15px;
}

#snoopy {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
  gap: 10px;
  width: 100%;
  margin: 15px 0;
}

#snoopy:empty {
  display: none;
}

#snoopy img {
  width: 100%;
  height: 115px;
  object-fit: contain;
  animation: flutuar 3s ease-in-out infinite;
  filter: drop-shadow(0 0 7px rgba(194, 60, 255, 0.55));
}

#snoopy img:nth-child(even) {
  animation-delay: 0.7s;
}

@keyframes flutuar {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-8px) rotate(2deg); }
}

.vermelho {
  background-image: none;
  background-color: #650b24;
}

.vermelho::before {
  background: rgba(70, 0, 20, 0.66);
}

/* TEMAS DAS FOTOS */

body.tema-anakin {
  background: #171717;
  background-image: none;
}

body.tema-anakin::before {
  background: rgba(0, 0, 0, 0.12);
}

body.tema-anakin::after {
  color: rgba(190, 190, 190, 0.25);
  text-shadow: 0 0 12px #777;
}

body.tema-melissa {
  background: #260044;
  background-image: none;
}

body.tema-cigana {
  background: #71320b;
  background-image: none;
}

body.tema-cigana::before {
  background: rgba(70, 25, 0, 0.25);
}

body.tema-cigana::after {
  color: rgba(255, 174, 74, 0.4);
  text-shadow: 0 0 12px #ff8c22;
}

body.tema-familia {
  background: linear-gradient(135deg, #101010 0%, #351707 55%, #a94c0b 100%);
  background-attachment: fixed;
  background-image: linear-gradient(135deg, #101010 0%, #351707 55%, #a94c0b 100%);
}

body.tema-familia::before {
  background: rgba(0, 0, 0, 0.12);
}

body.tema-familia::after {
  color: rgba(255, 155, 65, 0.35);
  text-shadow: 0 0 12px #ff791c;
}

/* TELA DAS FOTOS */

#cenaPet {
  display: none;
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 100vh;
  padding: 15px 5px 25px;
}

#cenaPet.ativa {
  display: block;
}

#galeriaPet {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: center;
  justify-items: center;
  gap: 22px 14px;
}

#galeriaPet img {
  display: block;
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border: none;
  border-radius: 12px;
  background: transparent;
  box-shadow: none;
  filter: drop-shadow(0 0 9px rgba(255,255,255,0.22));
  animation: fotoFlutuar 4s ease-in-out infinite;
}

#galeriaPet img:nth-child(even) {
  animation-delay: 0.8s;
}

#galeriaPet img:nth-child(3n) {
  animation-delay: 1.3s;
}

@keyframes fotoFlutuar {
  0%, 100% {
    transform: translateY(0) rotate(-1deg);
  }
  50% {
    transform: translateY(-7px) rotate(1deg);
  }
}

/* MENSAGENS NOS CANTOS */

#mensagemPet {
  position: absolute;
  z-index: 5;
  width: min(82%, 560px);
  padding: 17px;
  color: white;
  font-size: clamp(15px, 3.8vw, 21px);
  line-height: 1.55;
  text-align: left;
  white-space: pre-line;
  background: rgba(12, 12, 12, 0.94);
  border: 1px solid rgba(255,255,255,0.48);
  border-radius: 25px;
  box-shadow: 0 0 18px rgba(0,0,0,0.6);
}

#mensagemPet.superior-esquerdo {
  top: 10px;
  left: 5px;
}

#mensagemPet.inferior-esquerdo {
  bottom: 12px;
  left: 5px;
}

#mensagemPet.superior-direito {
  top: 10px;
  right: 5px;
}

#mensagemPet.inferior-direito {
  bottom: 12px;
  right: 5px;
}

/* Espaço reservado para não esconder fotos atrás das mensagens */

#cenaPet.reserva-superior {
  padding-top: 220px;
}

#cenaPet.reserva-inferior {
  padding-bottom: 230px;
}

#status {
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 5px black;
}

@media (max-width: 600px) {
  body {
    background-attachment: scroll;
  }

  #app {
    padding: 35px 20px;
  }

  h1 {
    margin-bottom: 38px;
  }

  #opcoes {
    gap: 14px;
  }

  button {
    min-height: 62px;
  }

  #cenaPet {
    padding-left: 5px;
    padding-right: 5px;
  }

  #galeriaPet {
    gap: 20px 10px;
  }

  #galeriaPet img {
    max-height: 165px;
  }

  #mensagemPet {
    width: 86%;
    padding: 14px;
    font-size: 15px;
    line-height: 1.5;
  }

  #cenaPet.reserva-superior {
    padding-top: 235px;
  }

  #cenaPet.reserva-inferior {
    padding-bottom: 250px;
  }
}
</style>
</head>

<body>

<div id="app">
  <h1 id="pergunta">Espero que goste independente das escolhas</h1>

  <div id="snoopy"></div>
  <p id="mensagem"></p>
  <div id="opcoes"></div>

  <textarea id="campo"
    placeholder="Escreva sua resposta..."
    style="display:none"></textarea>

  <button id="enviarTexto" style="display:none">
    Enviar resposta
  </button>

  <p id="status"></p>

  <div id="cenaPet">
    <div id="galeriaPet"></div>
    <div id="mensagemPet"></div>
  </div>
</div>

<audio id="musica" src="musica.mp3" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const opcoes = document.getElementById("opcoes");
const snoopy = document.getElementById("snoopy");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");
const cenaPet = document.getElementById("cenaPet");
const galeriaPet = document.getElementById("galeriaPet");
const mensagemPet = document.getElementById("mensagemPet");

function registrar(perguntaFeita, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      pergunta: perguntaFeita,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

function limpar() {
  opcoes.innerHTML = "";
  snoopy.innerHTML = "";
  mensagem.textContent = "";
  campo.value = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";

  cenaPet.classList.remove("ativa");
  galeriaPet.innerHTML = "";
  mensagemPet.textContent = "";
}

function botao(texto, acao) {
  const b = document.createElement("button");
  b.textContent = texto;
  b.onclick = acao;
  opcoes.appendChild(b);
}

function imagens(nomes) {
  snoopy.innerHTML = "";

  nomes.forEach(nome => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Snoopy";
    snoopy.appendChild(img);
  });
}

/* GALERIAS DOS NOSSOS FILHOS */

function abrirGaleria(titulo, tema, fotos, texto, canto) {
  limpar();

  document.body.className = tema;
  pergunta.textContent = titulo;

  cenaPet.className = "ativa";

  if (canto.includes("superior")) {
    cenaPet.classList.add("reserva-superior");
  } else {
    cenaPet.classList.add("reserva-inferior");
  }

  fotos.forEach(nome => {
    const img = document.createElement("img");
    img.src = "./" + nome;
    img.alt = titulo;
    img.loading = "lazy";
    img.onerror = () => {
      img.style.display = "none";
      console.error("Não foi possível carregar: " + nome);
    };
    galeriaPet.appendChild(img);
  });

  mensagemPet.textContent = texto;
  mensagemPet.className = canto;
}

function etapaFilhos() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "Quem você quer visitar? ❤️";

  botao("🖤 Anakin", () => {
    registrar("Nossos filhos", "Anakin");

    abrirGaleria(
      "Nosso querido Anakin 🖤",
      "tema-anakin",
      [
        "anakin.jpg",
        "anakin1.jpg",
        "anakin2.jpg",
        "anakin3.jpg",
        "anakin4.jpg",
        "anakin5.jpg",
        "anakin6.jpg"
      ],
      "E em meio ao pouco caos que estávamos em casa com as duas idosas, chegou um capetinha, ou melhor, um porcarinhazinha para agitar e animar nossa vida, o nosso querido filho Anakin que dorme com nós, nos perturba, pula nas nossas calças e vive miando por comida igual um desesperado. Nosso lindo filho 🖤",
      "superior-esquerdo"
    );
  });

  botao("💜 Melissa", () => {
    registrar("Nossos filhos", "Melissa");

    abrirGaleria(
      "Nossa linda Melissa Mel 💜",
      "tema-melissa",
      [
        "melissa.jpg",
        "melissa2.jpg",
        "melissa3.jpg",
        "melissa4.jpg",
        "melissa5.jpg"
      ],
      "Esse aqui é a mais manhosa, ansiosa igual ao pai e observadora igual a mãe. Antes mesmo de eu chegar na sua vida, ela já era seu mundo, apenas sou um planeta do sistema solar que continuará dando sentido ao mesmo universo que vc ama. Nossa linda e bela Melissa Mel 💜",
      "inferior-esquerdo"
    );
  });

  botao("🧡 Cigana", () => {
    registrar("Nossos filhos", "Cigana");

    abrirGaleria(
      "Nossa querida Cigana 🧡",
      "tema-cigana",
      [
        "cigana.jpg",
        "cigana2.jpg",
        "cigana3.jpg",
        "cigana4.jpg",
        "cigana5.jpg",
        "cigana6.jpg"
      ],
      "Lembro como se fosse ontem o trabalho para gente conseguir adotar ela, colocar ela dentro de casa, fazer ela comer ração, fazer ela ficar dentro de casa, fora as garras dela que rasgou o nosso colchão de ar novinho kkkkkkk ela é nossa filha mais senhora de alma, onde é preguiçosa, come e dorme além de se irritar fácil com agitação do Anakin. Nossa linda bola de pelo laranja que o melhor fato, é vc ser a mãe dela e quis adotar ela cmg mesmo ela sendo mais de idade.",
      "superior-direito"
    );
  });

  botao("🖤 Nossa família 🧡", () => {
    registrar("Nossos filhos", "Família");

    abrirGaleria(
      "Nossa família ❤️",
      "tema-familia",
      [
        "nos.jpg",
        "nos2.jpg",
        "nos3.jpg",
        "nos4.jpg",
        "nos5.jpg",
        "nos6.jpg",
        "nos7.jpg",
        "nos8.jpg",
        "nos9.jpg",
        "nos10.jpg"
      ],
      "Aqui estamos nós, a nossa família reunida, cada um de nós somos um planeta nesse universo enquanto VOCÊ Sarah Isabel, é o sol que ilumina a nossa existência. Graças a vc estamos todos ligados diretamente e somos uma família um pouco caótica mas muito feliz e amorosa. Amo muito você, igual amo cada um dos nossos filhos.\n\nE é claro, a nossa Diana terá lindas irmãs e um irmão capeta.",
      "inferior-direito"
    );
  });
}

function iniciar() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "Espero que goste independente das escolhas";

  botao("♡  Nossos filhos", () => {
    registrar(pergunta.textContent, "Nossos filhos");
    etapaFilhos();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    limpar();
    pergunta.textContent = "Entendi. Obrigado por responder.";
  });

  botao("♡  Talvez.", () => {
    registrar(pergunta.textContent, "Talvez");
    etapaTalvez();
  });

  botao("♡  Amo muito e ainda te quero.", () => {
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });
}

function etapaSim() {
  limpar();

  pergunta.textContent = "Eu também te amo ❤️";
  mensagem.textContent =
    "Você ainda é muito especial para mim.";

  imagens([
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png",
    "snoopy-coracao.png"
  ]);

  botao("Continuar", () => {
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

function etapaTalvez() {
  limpar();
  document.body.className = "vermelho";

  pergunta.textContent =
    "Então o que vc quer exatamente e como devo agir?";

  mensagem.textContent =
    "Pois voltar para CG se necessário, eu realmente irei.";

  campo.style.display = "block";
  enviarTexto.style.display = "inline-block";

  enviarTexto.onclick = () => {
    const resposta = campo.value.trim();

    if (!resposta) {
      status.textContent = "Escreva sua resposta primeiro.";
      return;
    }

    registrar(pergunta.textContent, resposta);

    campo.style.display = "none";
    enviarTexto.style.display = "none";
    opcoes.innerHTML = "";

    pergunta.textContent = "Obrigado por me responder.";
    mensagem.textContent = resposta;
    status.textContent = "Resposta enviada ❤️";
  };
}

function etapaGravidez() {
  limpar();
  document.body.className = "";

  musica.currentTime = 0;
  musica.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  pergunta.textContent = "Vc quer que esteja grávida?";

  botao("♡  Sim, quero muito", () => {
    registrar(pergunta.textContent, "Sim, quero muito");
    etapaFinal();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    musica.pause();
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

function etapaFinal() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "❤️";

  mensagem.textContent =
    "Então se cuide direito, coma por duas, beba água por duas, " +
    "tenha cuidado mental por duas. Estarei indo cuidar de você " +
    "e cuidar da Diana, errei em muitas coisas, eu sei, mas também " +
    "sei o quão te amo e o quanto quero que você seja a mãe da Diana, " +
    "pois uma bebezinha com o seu rosto será tão perfeita quanto você. " +
    "E vc será a mais incrível desse mundo enquanto cuidamos dela " +
    "desde cedo para irmos pro Canadá. Então, se cuidar pelas duas " +
    "e me espere que estou indo.";

  imagens([
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png"
  ]);
}

iniciar();
</script>

</body>
</html>
