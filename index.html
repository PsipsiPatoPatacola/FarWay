
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ❤️</title>

<style>
* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background-color: #170522;
  background-image: url("./fundo-snoopy.png?v=3");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  transition: background 0.7s;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(20, 0, 35, 0.25);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: "♡     ✦      ♥       ✧       ♡       ✦";
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-around;
  color: rgba(221, 90, 255, 0.55);
  font-size: 25px;
  text-shadow: 0 0 12px #d52cff, 0 0 24px #9d00ff;
  pointer-events: none;
  z-index: 0;
  animation: brilho 3s ease-in-out infinite alternate;
}

@keyframes brilho {
  from { opacity: 0.35; }
  to { opacity: 0.9; }
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 1100px;
  min-height: 100vh;
  margin: auto;
  padding: 45px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  width: min(100%, 720px);
  padding: 20px 16px;
  margin: 15px 0 45px;
  font-size: clamp(27px, 6vw, 43px);
  line-height: 1.3;
  background: rgba(31, 0, 53, 0.82);
  border: 2px solid #a52cff;
  border-radius: 30px;
  box-shadow: 0 0 14px #9c27ff,
              inset 0 0 14px rgba(160, 40, 255, 0.2);
  text-shadow: 0 0 12px #d66aff;
}

#mensagem {
  width: min(100%, 760px);
  padding: 18px;
  margin: 10px auto 25px;
  font-size: clamp(18px, 4vw, 24px);
  line-height: 1.6;
  white-space: pre-line;
  background: rgba(22, 0, 38, 0.78);
  border: 1px solid rgba(202, 75, 255, 0.55);
  border-radius: 20px;
  text-shadow: 0 1px 5px black;
  box-shadow: 0 0 15px rgba(164, 35, 255, 0.25);
}

#mensagem:empty { display: none; }

#opcoes {
  width: min(100%, 620px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0 auto 20px;
}

button {
  border: 2px solid #cf36ff;
  border-radius: 25px;
  padding: 16px 18px;
  min-height: 66px;
  font-size: clamp(17px, 4vw, 23px);
  color: white;
  background: rgba(55, 5, 91, 0.91);
  box-shadow: 0 0 12px rgba(190, 35, 255, 0.65),
              inset 0 0 10px rgba(190, 35, 255, 0.15);
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  background: rgba(105, 15, 150, 0.96);
  box-shadow: 0 0 22px #d52cff;
  transform: scale(1.02);
}

button:active { transform: scale(0.98); }

#campo {
  width: min(100%, 550px);
  min-height: 140px;
  padding: 14px;
  border: 2px solid #c52cff;
  border-radius: 15px;
  background: rgba(255,255,255,0.96);
  color: #24102d;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  margin-bottom: 15px;
}

#snoopy {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
  gap: 10px;
  width: 100%;
  margin: 15px 0;
}

#snoopy:empty { display: none; }

#snoopy img {
  width: 100%;
  height: 115px;
  object-fit: contain;
  animation: flutuar 3s ease-in-out infinite;
  filter: drop-shadow(0 0 7px rgba(194, 60, 255, 0.55));
}

#snoopy img:nth-child(even) {
  animation-delay: 0.7s;
}

@keyframes flutuar {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-8px) rotate(2deg); }
}

/* CORES DAS QUATRO GALERIAS */

body.tema-anakin {
  background: #252525;
  background-image: none;
}

body.tema-anakin::before {
  background: rgba(0, 0, 0, 0.25);
}

body.tema-anakin::after {
  color: rgba(220, 220, 220, 0.3);
  text-shadow: 0 0 12px #777;
}

body.tema-melissa {
  background: #310052;
  background-image: none;
}

body.tema-cigana {
  background: #a94308;
  background-image: none;
}

body.tema-cigana::before {
  background: rgba(65, 20, 0, 0.25);
}

body.tema-cigana::after {
  color: rgba(255, 190, 90, 0.45);
  text-shadow: 0 0 12px #ff8c25;
}

body.tema-familia {
  background: linear-gradient(135deg, #151515, #29130d, #a9470c);
  background-attachment: fixed;
  background-image: none;
}

body.tema-familia::before {
  background: rgba(0, 0, 0, 0.2);
}

/* NOVO ESTILO DAS FOTOS:
   SEM CARTÕES, SEM QUADRADOS E SEM MOLDURAS */

#app.galeria {
  max-width: 1200px;
  justify-content: flex-start;
  padding: 30px 20px 45px;
}

#app.galeria h1 {
  margin: 10px auto 20px;
  width: min(100%, 650px);
  font-size: clamp(23px, 4vw, 34px);
}

#app.galeria #mensagem {
  width: min(43%, 450px);
  font-size: clamp(14px, 1.7vw, 18px);
  line-height: 1.55;
  padding: 16px;
  margin: 12px 0;
  text-align: left;
  backdrop-filter: blur(7px);
  position: relative;
  z-index: 3;
}

/* Posição de cada mensagem */

#app.galeria.canto-anakin #mensagem {
  align-self: flex-start;
  margin-left: 0;
  background: rgba(10, 10, 10, 0.82);
  border-color: #888;
}

#app.galeria.canto-melissa #mensagem {
  align-self: flex-start;
  margin-top: 25px;
  background: rgba(35, 0, 55, 0.88);
  border-color: #d16aff;
}

#app.galeria.canto-cigana #mensagem {
  align-self: flex-end;
  background: rgba(75, 25, 0, 0.86);
  border-color: #ffb05b;
}

#app.galeria.canto-familia #mensagem {
  align-self: flex-end;
  background: rgba(15, 12, 10, 0.88);
  border-color: #ff9a45;
}

/* FOTOS ESPALHADAS COMO OS SNOOPYS */

#app.galeria #snoopy {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-around;
  gap: 5px;
  width: 100%;
  min-height: 390px;
  margin: 12px auto;
  padding: 5px;
}

#app.galeria #snoopy img {
  display: block;
  width: 22%;
  height: 155px;
  object-fit: contain;
  padding: 0;
  margin: 4px;
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  filter: drop-shadow(0 0 9px rgba(255,255,255,0.3));
  animation: fotoFlutuar 4s ease-in-out infinite;
}

#app.galeria #snoopy img:nth-child(3n) {
  width: 17%;
  height: 125px;
  animation-delay: 0.8s;
}

#app.galeria #snoopy img:nth-child(3n + 1) {
  transform: rotate(-5deg);
  animation-delay: 1.2s;
}

#app.galeria #snoopy img:nth-child(3n + 2) {
  transform: rotate(5deg);
  animation-delay: 0.4s;
}

@keyframes fotoFlutuar {
  0%, 100% {
    translate: 0 0;
  }
  50% {
    translate: 0 -12px;
  }
}

#app.galeria #opcoes {
  width: min(100%, 350px);
  margin: 15px auto 25px;
}

#app.galeria #opcoes button {
  background: rgba(0,0,0,0.65);
  border-color: rgba(255,255,255,0.55);
}

/* TELA TALVEZ */

.vermelho {
  background-color: #650b24;
}

.vermelho::before {
  background: rgba(70, 0, 20, 0.66);
}

#status {
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 5px black;
}

/* CELULAR */

@media (max-width: 650px) {
  body {
    background-attachment: scroll;
    background-position: center;
  }

  #app { padding: 35px 20px; }

  h1 { margin-bottom: 38px; }

  #opcoes { gap: 14px; }

  button { min-height: 62px; }

  #app.galeria {
    padding: 20px 12px;
  }

  #app.galeria h1 {
    margin-bottom: 12px;
  }

  #app.galeria #mensagem {
    width: 100%;
    max-height: none;
    font-size: 15px;
    margin: 12px 0;
  }

  #app.galeria #snoopy {
    min-height: 0;
    gap: 4px;
    margin: 12px auto;
    padding: 0;
  }

  #app.galeria #snoopy img {
    width: 30%;
    height: 125px;
    margin: 2px;
  }

  #app.galeria #snoopy img:nth-child(3n) {
    width: 25%;
    height: 105px;
  }

  #app.galeria #opcoes {
    margin-top: 20px;
  }
}
</style>
</head>

<body>

<div id="app">
  <h1 id="pergunta">Oi, vc ainda me ama?</h1>

  <div id="snoopy"></div>

  <p id="mensagem"></p>

  <div id="opcoes"></div>

  <textarea id="campo"
    placeholder="Escreva sua resposta..."
    style="display:none"></textarea>

  <button id="enviarTexto" style="display:none">
    Enviar resposta
  </button>

  <p id="status"></p>
</div>

<audio id="musica" src="musica.mp3" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const opcoes = document.getElementById("opcoes");
const snoopy = document.getElementById("snoopy");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");
const app = document.getElementById("app");

function registrar(perguntaFeita, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      pergunta: perguntaFeita,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

function limpar() {
  app.className = "";
  opcoes.innerHTML = "";
  snoopy.innerHTML = "";
  mensagem.textContent = "";
  campo.value = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";
}

function botao(texto, acao) {
  const b = document.createElement("button");
  b.textContent = texto;
  b.onclick = acao;
  opcoes.appendChild(b);
}

function imagens(nomes) {
  snoopy.innerHTML = "";

  nomes.forEach(nome => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Foto especial";
    img.loading = "lazy";

    img.onerror = () => {
      img.style.display = "none";
      console.error("Não foi possível carregar: " + nome);
    };

    snoopy.appendChild(img);
  });
}

/* PERGUNTA INICIAL */

function iniciar() {
  limpar();
  document.body.className = "";

  pergunta.textContent =
    "Espero que goste independente das escolhas";

  botao("♡  Nossos filhos", () => {
    registrar(pergunta.textContent, "Nossos filhos");
    etapaFilhos();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    limpar();
    pergunta.textContent = "Entendi. Obrigado por responder.";
  });

  botao("♡  Talvez.", () => {
    registrar(pergunta.textContent, "Talvez");
    etapaTalvez();
  });

  botao("♡  Amo muito e ainda te quero.", () => {
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });
}

/* ESCOLHA DOS FILHOS */

function etapaFilhos() {
  limpar();

  pergunta.textContent = "Quem vamos encontrar primeiro? ❤️";

  botao("🐈 Anakin", () => {
    registrar(pergunta.textContent, "Anakin");
    galeriaAnakin();
  });

  botao("🐶 Melissa", () => {
    registrar(pergunta.textContent, "Melissa");
    galeriaMelissa();
  });

  botao("🐈 Cigana", () => {
    registrar(pergunta.textContent, "Cigana");
    galeriaCigana();
  });

  botao("❤️ Nossa família", () => {
    registrar(pergunta.textContent, "Nossa família");
    galeriaFamilia();
  });
}

/* ABRIR GALERIA */

function abrirGaleria(tema, classe, titulo, texto, fotos) {
  limpar();

  document.body.className = tema;
  app.className = "galeria " + classe;

  pergunta.textContent = titulo;
  mensagem.textContent = texto;

  imagens(fotos);

  botao("← Voltar para os nossos filhos", () => {
    etapaFilhos();
  });
}

/* ANAKIN */

function galeriaAnakin() {
  abrirGaleria(
    "tema-anakin",
    "canto-anakin",
    "Nosso querido Anakin 🖤",

    "E em meio ao pouco caos que estávamos em casa com as duas idosas, chegou um capetinha, ou melhor, um porcarinhazinha para agitar e animar nossa vida, o nosso querido filho Anakin que dorme com nós, nos perturba, pula nas nossas calças e vive miando por comida igual um desesperado. Nosso lindo filho 🖤",

    [
      "anakin.jpg",
      "anakin1.jpg",
      "anakin2.jpg",
      "anakin3.jpg",
      "anakin4.jpg",
      "anakin5.jpg",
      "anakin6.jpg"
    ]
  );
}

/* MELISSA */

function galeriaMelissa() {
  abrirGaleria(
    "tema-melissa",
    "canto-melissa",
    "Nossa linda Melissa Mel 💜",

    "Esse aqui é a mais manhosa, ansiosa igual ao pai e observadora igual a mãe. Antes mesmo de eu chegar na sua vida, ela já era seu mundo, apenas sou um planeta do sistema solar que continuará dando sentido ao mesmo universo que vc ama. Nossa linda e bela Melissa Mel💜",

    [
      "melissa.jpg",
      "melissa2.jpg",
      "melissa3.jpg",
      "melissa4.jpg",
      "melissa5.jpg"
    ]
  );
}

/* CIGANA */

function galeriaCigana() {
  abrirGaleria(
    "tema-cigana",
    "canto-cigana",
    "Nossa Cigana 🧡",

    "Lembro como se fosse ontem o trabalho para gente conseguir adotar ela, colocar ela dentro de casa, fazer ela comer ração, fazer ela ficar dentro de casa, fora as garras dela que rasgou o nosso colchão de ar novinho kkkkkkk ela é nossa filha mais senhora de alma, onde é preguiçosa, come e dorme além de se irritar fácil com agitação do Anakin. Nossa linda bola de pelo laranja que o melhor fato, é vc ser a mãe dela e quis adotar ela cmg mesmo ela sendo mais de idade",

    [
      "cigana.jpg",
      "cigana2.jpg",
      "cigana3.jpg",
      "cigana4.jpg",
      "cigana5.jpg",
      "cigana6.jpg"
    ]
  );
}

/* FAMÍLIA */

function galeriaFamilia() {
  abrirGaleria(
    "tema-familia",
    "canto-familia",
    "Nosso pequeno universo ❤️",

    "Aqui estamos nós, a nossa família reunida, cada um de nós somos um planeta nesse universo enquanto VOCÊ Sarah Isabel, é o sol que ilumina a nossa existência. Graças a vc estamos todos ligados diretamente e somos uma família um pouco caótica mas muito feliz e amorosa. Amo muito você, igual amo cada um dos nossos filhos.\n\nE é claro, a nossa Diana terá lindas irmãs e um irmão capeta",

    [
      "nos.jpg",
      "nos2.jpg",
      "nos3.jpg",
      "nos4.jpg",
      "nos5.jpg",
      "nos6.jpg",
      "nos7.jpg",
      "nos8.jpg",
      "nos9.jpg",
      "nos10.jpg"
    ]
  );
}

/* TALVEZ */

function etapaTalvez() {
  limpar();
  document.body.className = "vermelho";

  pergunta.textContent =
    "Então o que vc quer exatamente e como devo agir?";

  mensagem.textContent =
    "Pois voltar para CG se necessário, eu realmente irei.";

  campo.style.display = "block";
  enviarTexto.style.display = "inline-block";

  enviarTexto.onclick = () => {
    const resposta = campo.value.trim();

    if (!resposta) {
      status.textContent = "Escreva sua resposta primeiro.";
      return;
    }

    registrar(pergunta.textContent, resposta);

    campo.style.display = "none";
    enviarTexto.style.display = "none";
    opcoes.innerHTML = "";

    pergunta.textContent = "Obrigado por me responder.";
    mensagem.textContent = resposta;
    status.textContent = "Resposta enviada ❤️";
  };
}

/* GRAVIDEZ */

function etapaGravidez() {
  limpar();
  document.body.className = "";

  musica.currentTime = 0;
  musica.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  pergunta.textContent = "Vc quer que esteja grávida?";

  botao("♡  Sim, quero muito", () => {
    registrar(pergunta.textContent, "Sim, quero muito");
    etapaFinal();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    musica.pause();
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

/* ETAPA FINAL */

function etapaFinal() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "❤️";

  mensagem.textContent =
    "Então se cuide direito, coma por duas, beba água por duas, " +
    "tenha cuidado mental por duas. Estarei indo cuidar de você " +
    "e cuidar da Diana, errei em muitas coisas, eu sei, mas também " +
    "sei o quão te amo e o quanto quero que você seja a mãe da Diana, " +
    "pois uma bebezinha com o seu rosto será tão perfeita quanto você. " +
    "E vc será a mais incrível desse mundo enquanto cuidamos dela " +
    "desde cedo para irmos pro Canadá. Então, se cuidar pelas duas " +
    "e me espere que estou indo.";

  imagens([
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png"
  ]);
}

iniciar();
</script>

</body>
</html>
