
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ❤️</title>

<style>
* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background-color: #170522;
  background-image: url("./fundo-snoopy.png?v=3");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
  transition: background-color .7s;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(20,0,35,.25);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: "♡   ✦   ♥   ✧   ♡   ✦";
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-around;
  color: rgba(221,90,255,.55);
  font-size: 25px;
  text-shadow: 0 0 12px #d52cff, 0 0 24px #9d00ff;
  pointer-events: none;
  z-index: 1;
  animation: brilho 3s ease-in-out infinite alternate;
}

@keyframes brilho {
  from { opacity: .35; }
  to { opacity: .9; }
}

#fotosFundo {
  display: none;
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

#fotosFundo img {
  position: absolute;
  width: clamp(100px, 27vw, 235px);
  height: clamp(100px, 20vh, 180px);
  object-fit: cover;
  border-radius: 20px;
  opacity: .72;
  filter: drop-shadow(0 0 12px rgba(255,255,255,.25));
  border: 2px solid rgba(255,255,255,.28);
  animation: flutuar 5s ease-in-out infinite alternate;
}

#fotosFundo img:nth-child(even) {
  animation-delay: 1s;
}

@keyframes flutuar {
  from { transform: translateY(0) rotate(-4deg); }
  to { transform: translateY(-12px) rotate(4deg); }
}

#app {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  margin: auto;
  padding: 45px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  width: min(100%,720px);
  padding: 20px 16px;
  margin: 15px 0 45px;
  font-size: clamp(27px,6vw,43px);
  line-height: 1.3;
  background: rgba(31,0,53,.82);
  border: 2px solid #a52cff;
  border-radius: 30px;
  box-shadow: 0 0 14px #9c27ff,
              inset 0 0 14px rgba(160,40,255,.2);
  text-shadow: 0 0 12px #d66aff;
}

#mensagem {
  width: min(100%,760px);
  padding: 18px;
  margin: 10px auto 25px;
  font-size: clamp(18px,4vw,24px);
  line-height: 1.6;
  white-space: pre-line;
  background: rgba(15,15,15,.78);
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 25px;
  text-shadow: 0 1px 5px black;
  box-shadow: 0 0 20px rgba(0,0,0,.4);
}

#mensagem:empty { display: none; }

#opcoes {
  width: min(100%,620px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0 auto 20px;
}

button {
  border: 2px solid #cf36ff;
  border-radius: 25px;
  padding: 16px 18px;
  min-height: 66px;
  font-size: clamp(17px,4vw,23px);
  color: white;
  background: rgba(55,5,91,.91);
  box-shadow: 0 0 12px rgba(190,35,255,.65),
              inset 0 0 10px rgba(190,35,255,.15);
  cursor: pointer;
  transition: .25s;
}

button:hover {
  background: rgba(105,15,150,.96);
  box-shadow: 0 0 22px #d52cff;
  transform: scale(1.02);
}

button:active { transform: scale(.98); }

#campo {
  width: min(100%,550px);
  min-height: 140px;
  padding: 14px;
  border: 2px solid #c52cff;
  border-radius: 15px;
  background: rgba(255,255,255,.96);
  color: #24102d;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  margin-bottom: 15px;
}

#snoopy {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(85px,1fr));
  gap: 10px;
  width: 100%;
  margin: 15px 0;
}

#snoopy:empty { display: none; }

#snoopy img {
  width: 100%;
  height: 115px;
  object-fit: contain;
  animation: flutuar 3s ease-in-out infinite;
  filter: drop-shadow(0 0 7px rgba(194,60,255,.55));
}

#snoopy img:nth-child(even) {
  animation-delay: .7s;
}

/* CENÁRIOS DAS FOTOS */

body.tela-fotos {
  background-image: none !important;
}

body.tela-fotos::before {
  background: rgba(0,0,0,.12);
}

body.tela-fotos #fotosFundo {
  display: block;
}

body.anakin {
  background-color: #252525;
}

body.anakin h1 {
  background: rgba(10,10,10,.82);
  border-color: #777;
  box-shadow: 0 0 18px rgba(255,255,255,.18);
  text-shadow: 0 0 12px #aaa;
}

body.melissa {
  background-color: #351052;
}

body.cigana {
  background-color: #a94c0b;
}

body.cigana h1 {
  background: rgba(80,30,0,.85);
  border-color: #ff9b32;
  box-shadow: 0 0 18px #ff8a19;
}

body.nos {
  background-color: #24170f;
}

body.nos h1 {
  background: rgba(10,10,10,.86);
  border-color: #e77b25;
  box-shadow: 0 0 18px #e77b25;
}

/* Mensagens posicionadas nos cantos escolhidos */

body.tela-fotos #mensagem {
  position: relative;
  z-index: 3;
  width: min(78%,620px);
  background: rgba(10,10,10,.78);
  border-color: rgba(255,255,255,.55);
  backdrop-filter: blur(3px);
}

body.anakin #mensagem {
  align-self: flex-start;
  margin-left: 0;
  margin-right: auto;
}

body.melissa #mensagem {
  align-self: flex-start;
  margin-top: auto;
  margin-left: 0;
  margin-right: auto;
}

body.cigana #mensagem {
  align-self: flex-end;
  margin-left: auto;
  margin-right: 0;
}

body.nos #mensagem {
  align-self: flex-end;
  margin-top: auto;
  margin-left: auto;
  margin-right: 0;
}

body.tela-fotos #app {
  justify-content: flex-start;
  min-height: 100vh;
}

body.tela-fotos h1 {
  position: relative;
  z-index: 3;
  margin-bottom: 25px;
}

body.tela-fotos #opcoes {
  position: relative;
  z-index: 3;
}

.vermelho { background-color: #650b24; }

.vermelho::before {
  background: rgba(70,0,20,.66);
}

#status {
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 5px black;
  position: relative;
  z-index: 4;
}

@media (max-width:600px) {
  body { background-attachment: scroll; }

  #app { padding: 35px 20px; }

  h1 { margin-bottom: 38px; }

  #opcoes { gap: 14px; }

  button { min-height: 62px; }

  body.tela-fotos #app {
    padding: 25px 14px;
    min-height: 100vh;
  }

  body.tela-fotos #mensagem {
    width: 78%;
    font-size: 17px;
    line-height: 1.5;
    padding: 14px;
  }

  #fotosFundo img {
    width: 29vw;
    height: 115px;
    border-radius: 15px;
  }
}
</style>
</head>

<body>

<div id="fotosFundo"></div>

<div id="app">
  <h1 id="pergunta">Espero que goste independente das escolhas</h1>

  <div id="snoopy"></div>

  <p id="mensagem"></p>

  <div id="opcoes"></div>

  <textarea id="campo"
    placeholder="Escreva sua resposta..."
    style="display:none"></textarea>

  <button id="enviarTexto" style="display:none">
    Enviar resposta
  </button>

  <p id="status"></p>
</div>

<audio id="musica" src="musica.mp3" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const opcoes = document.getElementById("opcoes");
const snoopy = document.getElementById("snoopy");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");
const fotosFundo = document.getElementById("fotosFundo");

function registrar(perguntaFeita, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      pergunta: perguntaFeita,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

function limpar() {
  opcoes.innerHTML = "";
  snoopy.innerHTML = "";
  mensagem.textContent = "";
  campo.value = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";
  fotosFundo.innerHTML = "";
}

function botao(texto, acao) {
  const b = document.createElement("button");
  b.textContent = texto;
  b.onclick = acao;
  opcoes.appendChild(b);
}

function imagens(nomes) {
  snoopy.innerHTML = "";

  nomes.forEach(nome => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Snoopy";
    snoopy.appendChild(img);
  });
}

/* Fotos espalhadas pelo fundo, atrás das mensagens */

const posicoes = [
  [2, 4, -8],
  [68, 5, 7],
  [3, 27, 5],
  [72, 30, -6],
  [5, 56, -5],
  [69, 57, 8],
  [35, 77, -4],
  [1, 82, 6],
  [72, 83, -7],
  [39, 42, 5]
];

function criarFundoFotos(nomes) {
  fotosFundo.innerHTML = "";

  nomes.forEach((nome, i) => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Foto da nossa família";

    const pos = posicoes[i % posicoes.length];

    img.style.left = pos[0] + "%";
    img.style.top = pos[1] + "%";
    img.style.transform = "rotate(" + pos[2] + "deg)";
    img.style.animationDelay = (i * .35) + "s";

    img.onerror = () => {
      img.style.display = "none";
      console.error("Não foi possível carregar: " + nome);
    };

    fotosFundo.appendChild(img);
  });
}

/* TELA INICIAL */

function iniciar() {
  document.body.className = "";
  limpar();

  pergunta.textContent = "Espero que goste independente das escolhas";

  botao("♡  Nossos filhos", () => {
    registrar(pergunta.textContent, "Nossos filhos");
    etapaFilhos();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    limpar();
    pergunta.textContent = "Entendi. Obrigado por responder.";
  });

  botao("♡  Talvez.", () => {
    registrar(pergunta.textContent, "Talvez");
    etapaTalvez();
  });

  botao("♡  Amo muito e ainda te quero.", () => {
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });
}

/* ESCOLHA DOS FILHOS */

function etapaFilhos() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "Nossa família ❤️";

  botao("🖤 Anakin", () => {
    registrar("Nossos filhos", "Anakin");
    mostrarAnakin();
  });

  botao("💜 Melissa", () => {
    registrar("Nossos filhos", "Melissa");
    mostrarMelissa();
  });

  botao("🧡 Cigana", () => {
    registrar("Nossos filhos", "Cigana");
    mostrarCigana();
  });

  botao("🖤🧡 Família", () => {
    registrar("Nossos filhos", "Família");
    mostrarNos();
  });
}

function voltarFilhos() {
  botao("Voltar à escolha dos filhos ❤️", etapaFilhos);
}

/* ANAKIN */

function mostrarAnakin() {
  limpar();
  document.body.className = "tela-fotos anakin";

  pergunta.textContent = "Nosso querido Anakin 🖤";

  mensagem.textContent =
    "E em meio ao pouco caos que estávamos em casa com as duas idosas, chegou um capetinha, ou melhor, um porcarinhazinha para agitar e animar nossa vida, o nosso querido filho Anakin que dorme com nós, nos perturba, pula nas nossas calças e vive miando por comida igual um desesperado. Nosso lindo filho 🖤";

  criarFundoFotos([
    "anakin.jpg",
    "anakin1.jpg",
    "anakin2.jpg",
    "anakin3.jpg",
    "anakin4.jpg",
    "anakin5.jpg",
    "anakin6.jpg"
  ]);

  voltarFilhos();
}

/* MELISSA */

function mostrarMelissa() {
  limpar();
  document.body.className = "tela-fotos melissa";

  pergunta.textContent = "Nossa linda Melissa Mel 💜";

  mensagem.textContent =
    "Esse aqui é a mais manhosa, ansiosa igual ao pai e observadora igual a mãe. Antes mesmo de eu chegar na sua vida, ela já era seu mundo, apenas sou um planeta do sistema solar que continuará dando sentido ao mesmo universo que vc ama. Nossa linda e bela Melissa Mel 💜";

  criarFundoFotos([
    "melissa.jpg",
    "melissa2.jpg",
    "melissa3.jpg",
    "melissa4.jpg",
    "melissa5.jpg"
  ]);

  voltarFilhos();
}

/* CIGANA */

function mostrarCigana() {
  limpar();
  document.body.className = "tela-fotos cigana";

  pergunta.textContent = "Nossa Cigana 🧡";

  mensagem.textContent =
    "Lembro como se fosse ontem o trabalho para gente conseguir adotar ela, colocar ela dentro de casa, fazer ela comer ração, fazer ela ficar dentro de casa, fora as garras dela que rasgou o nosso colchão de ar novinho kkkkkkk ela é nossa filha mais senhora de alma, onde é preguiçosa, come e dorme além de se irritar fácil com agitação do Anakin. Nossa linda bola de pelo laranja que o melhor fato, é vc ser a mãe dela e quis adotar ela cmg mesmo ela sendo mais de idade";

  criarFundoFotos([
    "cigana.jpg",
    "cigana2.jpg",
    "cigana3.jpg",
    "cigana4.jpg",
    "cigana5.jpg",
    "cigana6.jpg"
  ]);

  voltarFilhos();
}

/* FAMÍLIA */

function mostrarNos() {
  limpar();
  document.body.className = "tela-fotos nos";

  pergunta.textContent = "Nossa família 🖤🧡";

  mensagem.textContent =
    "Aqui estamos nós, a nossa família reunida, cada um de nós somos um planeta nesse universo enquanto VOCÊ Sarah Isabel, é o sol que ilumina a nossa existência. Graças a vc estamos todos ligados diretamente e somos uma família um pouco caótica mas muito feliz e amorosa. Amo muito você, igual amo cada um dos nossos filhos.\n\nE é claro, a nossa Diana terá lindas irmãs e um irmão capeta";

  criarFundoFotos([
    "nos.jpg",
    "nos2.jpg",
    "nos3.jpg",
    "nos4.jpg",
    "nos5.jpg",
    "nos6.jpg",
    "nos7.jpg",
    "nos8.jpg",
    "nos9.jpg",
    "nos10.jpg"
  ]);

  voltarFilhos();
}

/* TALVEZ */

function etapaTalvez() {
  limpar();
  document.body.className = "vermelho";

  pergunta.textContent =
    "Então o que vc quer exatamente e como devo agir?";

  mensagem.textContent =
    "Pois voltar para CG se necessário, eu realmente irei.";

  campo.style.display = "block";
  enviarTexto.style.display = "inline-block";

  enviarTexto.onclick = () => {
    const resposta = campo.value.trim();

    if (!resposta) {
      status.textContent = "Escreva sua resposta primeiro.";
      return;
    }

    registrar(pergunta.textContent, resposta);

    campo.style.display = "none";
    enviarTexto.style.display = "none";
    opcoes.innerHTML = "";

    pergunta.textContent = "Obrigado por me responder.";
    mensagem.textContent = resposta;
    status.textContent = "Resposta enviada ❤️";
  };
}

/* GRAVIDEZ */

function etapaGravidez() {
  limpar();
  document.body.className = "";

  musica.currentTime = 0;
  musica.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  pergunta.textContent = "Vc quer que esteja grávida?";

  botao("♡  Sim, quero muito", () => {
    registrar(pergunta.textContent, "Sim, quero muito");
    etapaFinal();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    musica.pause();
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

/* MENSAGEM FINAL */

function etapaFinal() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "❤️";

  mensagem.textContent =
    "Então se cuide direito, coma por duas, beba água por duas, " +
    "tenha cuidado mental por duas. Estarei indo cuidar de você " +
    "e cuidar da Diana, errei em muitas coisas, eu sei, mas também " +
    "sei o quão te amo e o quanto quero que você seja a mãe da Diana, " +
    "pois uma bebezinha com o seu rosto será tão perfeita quanto você. " +
    "E vc será a mais incrível desse mundo enquanto cuidamos dela " +
    "desde cedo para irmos pro Canadá. Então, se cuidar pelas duas " +
    "e me espere que estou indo.";

  imagens([
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png"
  ]);
}

iniciar();
</script>

</body>
</html>
