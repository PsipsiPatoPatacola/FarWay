
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ❤️</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  background: #170522 url("./fundo-snoopy.png?v=3") center/cover fixed;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
  transition: background 0.7s;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(15,0,25,0.22);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 1000px;
  min-height: 100vh;
  margin: auto;
  padding: 45px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  position: relative;
  z-index: 3;
  width: min(100%,720px);
  padding: 20px 16px;
  margin: 15px 0 40px;
  font-size: clamp(27px,6vw,43px);
  line-height: 1.3;
  background: rgba(25,0,40,0.72);
  border: 2px solid #a52cff;
  border-radius: 30px;
  box-shadow: 0 0 18px #9c27ff;
  text-shadow: 0 0 12px #d66aff;
}

#mensagem {
  position: relative;
  z-index: 3;
  width: min(92%,780px);
  padding: 12px;
  margin: 25px auto;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(19px,4.5vw,26px);
  line-height: 1.65;
  color: white;
  text-align: center;
  white-space: pre-line;
  background: transparent;
  border: none;
  box-shadow: none;
  text-shadow: 0 2px 5px #000, 0 0 12px rgba(0,0,0,0.95);
}

#mensagem:empty { display: none; }

#opcoes {
  position: relative;
  z-index: 4;
  width: min(100%,620px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0 auto 20px;
}

button {
  border: 2px solid #cf36ff;
  border-radius: 25px;
  padding: 16px 18px;
  min-height: 66px;
  font-size: clamp(17px,4vw,23px);
  color: white;
  background: rgba(55,5,91,0.91);
  box-shadow: 0 0 12px rgba(190,35,255,0.65);
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  transform: scale(1.02);
  box-shadow: 0 0 22px #d52cff;
}

#campo {
  position: relative;
  z-index: 4;
  width: min(100%,550px);
  min-height: 140px;
  padding: 14px;
  border: 2px solid #c52cff;
  border-radius: 15px;
  background: rgba(255,255,255,0.96);
  color: #24102d;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  margin-bottom: 15px;
}

#enviarTexto, #status {
  position: relative;
  z-index: 4;
}

#status {
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 5px black;
}

/* Fotos espalhadas atrás das mensagens */
#fundoFotos {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
  display: none;
}

#fundoFotos.ativo { display: block; }

.foto-fundo {
  position: absolute;
  width: clamp(155px,34vw,330px);
  height: clamp(125px,27vw,245px);
  object-fit: cover;
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,0.35);
  opacity: 0.76;
  box-shadow: 0 0 25px rgba(255,255,255,0.18);
  animation: flutuar 5s ease-in-out infinite;
}

@keyframes flutuar {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-13px) rotate(3deg); }
}

.foto-fundo:nth-child(1) { top: 4%; left: 2%; }
.foto-fundo:nth-child(2) { top: 5%; right: 2%; }
.foto-fundo:nth-child(3) { top: 34%; left: -5%; }
.foto-fundo:nth-child(4) { top: 35%; right: -5%; }
.foto-fundo:nth-child(5) { bottom: 5%; left: 3%; }
.foto-fundo:nth-child(6) { bottom: 4%; right: 3%; }
.foto-fundo:nth-child(7) {
  top: 68%;
  left: 36%;
  width: clamp(140px,28vw,250px);
  height: clamp(115px,23vw,200px);
}

/* Cores das seções */
body.anakin { background: #171717; }
body.anakin::before { background: rgba(0,0,0,0.30); }

body.melissa { background: #27083d; }
body.melissa::before { background: rgba(35,0,55,0.28); }

body.cigana { background: #542000; }
body.cigana::before { background: rgba(65,25,0,0.30); }

body.nos { background: #171313; }
body.nos::before { background: rgba(30,12,0,0.30); }

body.vermelho { background: #650b24; }
body.vermelho::before { background: rgba(70,0,20,0.66); }

body.anakin h1 {
  border-color: #777;
  box-shadow: 0 0 18px rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.65);
}

body.melissa h1 { border-color: #d52cff; }

body.cigana h1 {
  border-color: #ff9a32;
  box-shadow: 0 0 18px #ff7b00;
  background: rgba(65,25,0,0.75);
}

body.nos h1 {
  border-color: #ff8a28;
  box-shadow: 0 0 18px #ff7b00;
  background: rgba(0,0,0,0.72);
}

#snoopy {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(85px,1fr));
  gap: 10px;
  width: 100%;
  margin: 15px 0;
}

#snoopy:empty { display: none; }

#snoopy img {
  width: 100%;
  height: 115px;
  object-fit: contain;
  animation: flutuar 3s ease-in-out infinite;
  filter: drop-shadow(0 0 7px rgba(194,60,255,0.55));
}

@media (max-width:600px) {
  body { background-attachment: scroll; }

  #app { padding: 35px 16px; }

  h1 { margin-bottom: 30px; }

  .foto-fundo {
    width: 43vw;
    height: 155px;
    border-radius: 17px;
    opacity: 0.72;
  }

  .foto-fundo:nth-child(1) { top: 5%; left: 1%; }
  .foto-fundo:nth-child(2) { top: 7%; right: 1%; }
  .foto-fundo:nth-child(3) { top: 37%; left: -12%; }
  .foto-fundo:nth-child(4) { top: 39%; right: -12%; }
  .foto-fundo:nth-child(5) { bottom: 5%; left: 0; }
  .foto-fundo:nth-child(6) { bottom: 5%; right: 0; }
  .foto-fundo:nth-child(7) {
    top: 70%;
    left: 35%;
    width: 35vw;
    height: 130px;
  }

  #mensagem {
    width: 94%;
    font-size: 20px;
    line-height: 1.65;
    padding: 10px 4px;
    margin: 25px auto;
  }
}
</style>
</head>

<body>

<div id="fundoFotos"></div>

<div id="app">
  <h1 id="pergunta">Espero que goste independente das escolhas</h1>
  <div id="snoopy"></div>
  <p id="mensagem"></p>

  <div id="opcoes"></div>

  <textarea id="campo"
    placeholder="Escreva sua resposta..."
    style="display:none"></textarea>

  <button id="enviarTexto" style="display:none">
    Enviar resposta
  </button>

  <p id="status"></p>
</div>

<!-- Música original da parte antiga -->
<audio id="musica" src="musica.mp3" preload="auto"></audio>

<!-- Música exclusiva das partes dos filhos -->
<audio id="musicaFilhos" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const opcoes = document.getElementById("opcoes");
const snoopy = document.getElementById("snoopy");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");
const musicaFilhos = document.getElementById("musicaFilhos");
const fundoFotos = document.getElementById("fundoFotos");

const fotos = {
  anakin: [
    "anakin.jpg",
    "anakin1.jpg",
    "anakin2.jpg",
    "anakin3.jpg",
    "anakin4.jpg",
    "anakin5.jpg",
    "anakin6.jpg"
  ],

  cigana: [
    "cigana.jpg",
    "cigana2.jpg",
    "cigana3.jpg",
    "cigana4.jpg",
    "cigana5.jpg",
    "cigana6.jpg"
  ],

  melissa: [
    "melissa.jpg",
    "melissa2.jpg",
    "melissa3.jpg",
    "melissa4.jpg",
    "melissa5.jpg"
  ],

  nos: [
    "nos.jpg",
    "nos2.jpg",
    "nos3.jpg",
    "nos4.jpg",
    "nos5.jpg",
    "nos6.jpg",
    "nos7.jpg",
    "nos8.jpg",
    "nos9.jpg",
    "nos10.jpg"
  ]
};

/* Associa cada seção à sua música */
const musicasDosFilhos = {
  anakin: "musicaanakin.mp3",
  melissa: "musicamelissa.mp3",
  cigana: "musicacigana.mp3",
  nos: "musicanos.mp3"
};

function pararMusicaFilhos() {
  musicaFilhos.pause();
  musicaFilhos.currentTime = 0;
  musicaFilhos.removeAttribute("src");
  musicaFilhos.load();
}

function tocarMusicaFilho(tipo) {
  musica.pause();
  pararMusicaFilhos();

  musicaFilhos.src = musicasDosFilhos[tipo];
  musicaFilhos.load();

  musicaFilhos.play().catch(() => {
    status.textContent =
      "Se a música não começar, toque na tela para iniciar.";
  });
}

function registrar(perguntaFeita, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      pergunta: perguntaFeita,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

function limpar() {
  opcoes.innerHTML = "";
  snoopy.innerHTML = "";
  mensagem.textContent = "";
  campo.value = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";
  fundoFotos.innerHTML = "";
  fundoFotos.classList.remove("ativo");
}

function botao(texto, acao) {
  const b = document.createElement("button");
  b.textContent = texto;
  b.onclick = acao;
  opcoes.appendChild(b);
}

function imagensSnoopy(nomes) {
  snoopy.innerHTML = "";

  nomes.forEach(nome => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Snoopy";
    snoopy.appendChild(img);
  });
}

function colocarFotos(lista) {
  fundoFotos.innerHTML = "";
  fundoFotos.classList.add("ativo");

  lista.forEach((nome, indice) => {
    const img = document.createElement("img");
    img.className = "foto-fundo";
    img.src = nome;
    img.alt = "Foto da nossa família";
    img.onerror = () => { img.style.display = "none"; };
    img.style.animationDelay = (indice * 0.35) + "s";
    fundoFotos.appendChild(img);
  });
}

function iniciar() {
  pararMusicaFilhos();
  musica.pause();
  document.body.className = "";
  limpar();

  pergunta.textContent = "Espero que goste independente das escolhas";

  botao("♡  Nossos filhos", () => {
    registrar(pergunta.textContent, "Nossos filhos");
    etapaFilhos();
  });

  botao("♡  Não.", () => {
    pararMusicaFilhos();
    registrar(pergunta.textContent, "Não");
    limpar();
    pergunta.textContent = "Entendi. Obrigado por responder.";
  });

  botao("♡  Talvez.", () => {
    pararMusicaFilhos();
    registrar(pergunta.textContent, "Talvez");
    etapaTalvez();
  });

  botao("♡  Amo muito e ainda te quero.", () => {
    pararMusicaFilhos();
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });
}

function etapaFilhos() {
  pararMusicaFilhos();
  musica.pause();
  limpar();
  document.body.className = "";

  pergunta.textContent = "Nossos filhos ❤️";

  botao("🖤 Anakin", () => {
    registrar("Nossos filhos", "Anakin");
    etapaPet("anakin");
  });

  botao("💜 Melissa", () => {
    registrar("Nossos filhos", "Melissa");
    etapaPet("melissa");
  });

  botao("🧡 Cigana", () => {
    registrar("Nossos filhos", "Cigana");
    etapaPet("cigana");
  });

  botao("🖤 Nossa família", () => {
    registrar("Nossos filhos", "Nossa família");
    etapaPet("nos");
  });
}

function etapaPet(tipo) {
  limpar();
  document.body.className = tipo;

  colocarFotos(fotos[tipo]);
  tocarMusicaFilho(tipo);

  if (tipo === "anakin") {
    pergunta.textContent = "Nosso querido Anakin 🖤";
    mensagem.textContent =
      "E em meio ao pouco caos que estávamos em casa com as duas idosas, chegou um capetinha, ou melhor, um porcarinhazinha para agitar e animar nossa vida, o nosso querido filho Anakin que dorme com nós, nos perturba, pula nas nossas calças e vive miando por comida igual um desesperado. Nosso lindo filho 🖤";
  }

  if (tipo === "melissa") {
    pergunta.textContent = "Nossa linda Melissa Mel 💜";
    mensagem.textContent =
      "Esse aqui é a mais manhosa, ansiosa igual ao pai e observadora igual a mãe. Antes mesmo de eu chegar na sua vida, ela já era seu mundo, apenas sou um planeta do sistema solar que continuará dando sentido ao mesmo universo que vc ama. Nossa linda e bela Melissa Mel 💜";
  }

  if (tipo === "cigana") {
    pergunta.textContent = "Nossa querida Cigana 🧡";
    mensagem.textContent =
      "Lembro como se fosse ontem o trabalho para gente conseguir adotar ela, colocar ela dentro de casa, fazer ela comer ração, fazer ela ficar dentro de casa, fora as garras dela que rasgou o nosso colchão de ar novinho kkkkkkk ela é nossa filha mais senhora de alma, onde é preguiçosa, come e dorme além de se irritar fácil com agitação do Anakin. Nossa linda bola de pelo laranja que o melhor fato, é vc ser a mãe dela e quis adotar ela cmg mesmo ela sendo mais de idade";
  }

  if (tipo === "nos") {
    pergunta.textContent = "Nossa família 🖤🧡";
    mensagem.textContent =
      "Aqui estamos nós, a nossa família reunida, cada um de nós somos um planeta nesse universo enquanto VOCÊ Sarah Isabel, é o sol que ilumina a nossa existência. Graças a vc estamos todos ligados diretamente e somos uma família um pouco caótica mas muito feliz e amorosa. Amo muito você, igual amo cada um dos nossos filhos.\n\nE é claro, a nossa Diana terá lindas irmãs e um irmão capeta";
  }

  botao("Voltar à escolha dos filhos ❤️", etapaFilhos);
}

function etapaSim() {
  pararMusicaFilhos();
  limpar();

  pergunta.textContent = "Eu também te amo ❤️";
  mensagem.textContent = "Você ainda é muito especial para mim.";

  imagensSnoopy([
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png",
    "snoopy-coracao.png"
  ]);

  botao("Continuar", () => {
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

function etapaTalvez() {
  pararMusicaFilhos();
  limpar();
  document.body.className = "vermelho";

  pergunta.textContent =
    "Então o que vc quer exatamente e como devo agir?";

  mensagem.textContent =
    "Pois voltar para CG se necessário, eu realmente irei.";

  campo.style.display = "block";
  enviarTexto.style.display = "inline-block";

  enviarTexto.onclick = () => {
    const resposta = campo.value.trim();

    if (!resposta) {
      status.textContent = "Escreva sua resposta primeiro.";
      return;
    }

    registrar(pergunta.textContent, resposta);

    campo.style.display = "none";
    enviarTexto.style.display = "none";
    opcoes.innerHTML = "";

    pergunta.textContent = "Obrigado por me responder.";
    mensagem.textContent = resposta;
    status.textContent = "Resposta enviada ❤️";
  };
}

function etapaGravidez() {
  pararMusicaFilhos();
  limpar();
  document.body.className = "";

  musica.pause();
  musica.currentTime = 0;
  musica.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  pergunta.textContent = "Vc quer que esteja grávida?";

  botao("♡  Sim, quero muito", () => {
    registrar(pergunta.textContent, "Sim, quero muito");
    etapaFinal();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    musica.pause();
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

function etapaFinal() {
  pararMusicaFilhos();
  limpar();
  document.body.className = "";

  pergunta.textContent = "❤️";

  mensagem.textContent =
    "Então se cuide direito, coma por duas, beba água por duas, " +
    "tenha cuidado mental por duas. Estarei indo cuidar de você " +
    "e cuidar da Diana, errei em muitas coisas, eu sei, mas também " +
    "sei o quão te amo e o quanto quero que você seja a mãe da Diana, " +
    "pois uma bebezinha com o seu rosto será tão perfeita quanto você. " +
    "E vc será a mais incrível desse mundo enquanto cuidamos dela " +
    "desde cedo para irmos pro Canadá. Então, se cuidar pelas duas " +
    "e me espere que estou indo.";

  imagensSnoopy([
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png"
  ]);
}

iniciar();
</script>

</body>
</html>
