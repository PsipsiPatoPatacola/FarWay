
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IdiotaBurro1904 ♡</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background: #170522 url("./fundo-snoopy.png") center/cover fixed;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(15,0,25,.22);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 1000px;
  min-height: 100vh;
  margin: auto;
  padding: 45px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  position: relative;
  z-index: 4;
  width: min(100%,720px);
  padding: 20px 16px;
  margin: 15px 0 40px;
  font-size: clamp(27px,6vw,43px);
  line-height: 1.3;
  background: rgba(25,0,40,.72);
  border: 2px solid #a52cff;
  border-radius: 30px;
  box-shadow: 0 0 18px #9c27ff;
  text-shadow: 0 0 12px #d66aff;
}

#mensagem {
  position: relative;
  z-index: 4;
  width: min(92%,780px);
  padding: 12px;
  margin: 25px auto;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(19px,4.5vw,26px);
  line-height: 1.65;
  color: white;
  text-align: center;
  white-space: pre-line;
  background: transparent;
  border: none;
  text-shadow: 0 2px 5px #000, 0 0 12px rgba(0,0,0,.95);
}

#mensagem:empty { display: none; }

#opcoes {
  position: relative;
  z-index: 5;
  width: min(100%,620px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0 auto 20px;
}

button {
  border: 2px solid #cf36ff;
  border-radius: 25px;
  padding: 16px 18px;
  min-height: 66px;
  font-size: clamp(17px,4vw,23px);
  color: white;
  background: rgba(55,5,91,.91);
  box-shadow: 0 0 12px rgba(190,35,255,.45);
  cursor: pointer;
  transition: .25s;
}

button:hover {
  transform: scale(1.02);
  box-shadow: 0 0 18px rgba(213,44,255,.65);
}

#campo {
  position: relative;
  z-index: 5;
  width: min(100%,550px);
  min-height: 140px;
  padding: 14px;
  border: 2px solid #c52cff;
  border-radius: 15px;
  background: rgba(255,255,255,.96);
  color: #24102d;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  margin-bottom: 15px;
}

#enviarTexto, #status { position: relative; z-index: 5; }

#status {
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 5px black;
}

#snoopy {
  position: relative;
  z-index: 4;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(85px,1fr));
  gap: 10px;
  width: 100%;
  margin: 15px 0;
}

#snoopy:empty { display: none; }

#snoopy img {
  width: 100%;
  height: 115px;
  object-fit: contain;
  animation: flutuar 3s ease-in-out infinite;
  filter: drop-shadow(0 0 5px rgba(194,60,255,.35));
}

@keyframes flutuar {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-13px) rotate(3deg); }
}

/* Fotos de fundo */
#fundoFotos {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
  display: none;
}

#fundoFotos.ativo { display: block; }

.foto-fundo {
  position: absolute;
  width: clamp(155px,34vw,330px);
  height: clamp(125px,27vw,245px);
  object-fit: cover;
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,.35);
  opacity: .76;
  box-shadow: 0 0 20px rgba(255,255,255,.12);
  animation: flutuar 5s ease-in-out infinite;
}

.foto-fundo:nth-child(1) { top: 4%; left: 2%; }
.foto-fundo:nth-child(2) { top: 5%; right: 2%; }
.foto-fundo:nth-child(3) { top: 34%; left: -5%; }
.foto-fundo:nth-child(4) { top: 35%; right: -5%; }
.foto-fundo:nth-child(5) { bottom: 5%; left: 3%; }
.foto-fundo:nth-child(6) { bottom: 4%; right: 3%; }
.foto-fundo:nth-child(7) {
  top: 68%;
  left: 36%;
  width: clamp(140px,28vw,250px);
  height: clamp(115px,23vw,200px);
}

/* Temas dos animais e família */
body.anakin { background: #171717; }
body.melissa { background: #27083d; }
body.cigana { background: #542000; }
body.nos { background: #171313; }
body.vermelho { background: #650b24; }

body.anakin::before { background: rgba(0,0,0,.30); }
body.melissa::before { background: rgba(35,0,55,.28); }
body.cigana::before { background: rgba(65,25,0,.30); }
body.nos::before { background: rgba(30,12,0,.30); }
body.vermelho::before { background: rgba(70,0,20,.66); }

/* Ramificação: Por que você é assim */
body.talvez-vermelho {
  background: #39000b;
}

body.talvez-vermelho::before {
  background: url("./fundo-snoopy.png") center/cover fixed no-repeat;
  filter: sepia(1) saturate(5) hue-rotate(315deg);
  opacity: .85;
}

body.talvez-laranja {
  background: #421900;
}

body.talvez-laranja::before {
  background: url("./fundo-snoopy.png") center/cover fixed no-repeat;
  filter: sepia(1) saturate(5) hue-rotate(345deg);
  opacity: .88;
}

body.talvez-vermelho h1,
body.talvez-laranja h1 {
  background: rgba(20,0,0,.72);
  border-radius: 25px;
  padding: 18px;
  margin-bottom: 15px;
}

body.talvez-vermelho h1 {
  border-color: #ff4242;
  box-shadow: 0 0 18px #ff2424;
  text-shadow: 0 0 12px #ff7777;
}

body.talvez-laranja h1 {
  border-color: #ff9b32;
  box-shadow: 0 0 18px #ff851b;
  text-shadow: 0 0 12px #ffc078;
}

body.talvez-vermelho #mensagem,
body.talvez-laranja #mensagem {
  width: min(96%,850px);
  padding: 15px;
  margin: 15px auto 25px;
  font-size: clamp(17px,4vw,22px);
  line-height: 1.75;
  text-align: left;
  background: rgba(15,0,0,.65);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.18);
  text-shadow: 0 2px 5px #000;
}

body.talvez-vermelho button {
  background: rgba(90,0,15,.94);
  border-color: #ff5555;
  box-shadow: 0 0 12px rgba(255,50,50,.45);
}

body.talvez-laranja button {
  background: rgba(105,43,0,.94);
  border-color: #ff9b32;
  box-shadow: 0 0 12px rgba(255,140,30,.45);
}

body.talvez-vermelho button:hover {
  box-shadow: 0 0 18px rgba(255,70,70,.75);
}

body.talvez-laranja button:hover {
  box-shadow: 0 0 18px rgba(255,160,50,.75);
}

/* Tela cinza e ciano */
body.fim-ciano {
  background: #18252a;
  color: #e8fbff;
  background-attachment: fixed;
}

body.fim-ciano::before {
  background-image: url("./fundo-snoopy.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  opacity: .68;
  filter: grayscale(.55) hue-rotate(145deg) saturate(.65);
  background-color: rgba(15,30,35,.55);
}

body.fim-ciano h1 {
  color: #e9fcff;
  background: transparent;
  border: none;
  box-shadow: none;
  text-shadow: 0 0 9px rgba(130,240,255,.45);
  padding: 10px;
}

body.fim-ciano #mensagem {
  color: #e8faff;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: clamp(19px,4.5vw,27px);
  line-height: 1.8;
  text-shadow: 0 2px 7px #071317, 0 0 10px rgba(0,0,0,.85);
}

body.fim-ciano button {
  color: #effcff;
  background: rgba(26,58,65,.90);
  border: 2px solid #83e5ee;
  box-shadow: 0 0 10px rgba(111,225,237,.35);
}

body.fim-ciano button:hover {
  box-shadow: 0 0 16px rgba(131,229,238,.55);
}

/* Luvinhas animadas */
.luvinha {
  display: inline-block;
  font-size: 31px;
  vertical-align: middle;
  margin-right: 12px;
  filter: drop-shadow(0 0 4px rgba(184,250,255,.55));
  transform-origin: bottom center;
  animation: luvaAnimada 1.15s ease-in-out infinite;
}

#opcoes button:nth-child(2) .luvinha { animation-delay: .55s; }

@keyframes luvaAnimada {
  0%,100% { transform: translateY(0) rotate(-13deg) scale(1); }
  25% { transform: translateY(-8px) rotate(12deg) scale(1.10); }
  50% { transform: translateY(-3px) rotate(-8deg) scale(1.04); }
  75% { transform: translateY(-9px) rotate(14deg) scale(1.10); }
}

body.fim-ciano #opcoes button {
  animation: botaoJogo 2s ease-in-out infinite;
}

body.fim-ciano #opcoes button:nth-child(2) { animation-delay: 1s; }

@keyframes botaoJogo {
  0%,45%,100% {
    box-shadow: 0 0 9px rgba(111,225,237,.30);
    border-color: #83e5ee;
  }
  20% {
    box-shadow: 0 0 15px rgba(111,225,237,.65);
    border-color: #d2fbff;
  }
}

/* Snoopy decorativo da tela ciano */
#decoracaoFim {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

body.fim-ciano #decoracaoFim { display: block; }

.snoopy-decor {
  position: absolute;
  width: clamp(115px,28vw,230px);
  height: clamp(115px,28vw,230px);
  object-fit: contain;
  opacity: .90;
  filter: drop-shadow(0 0 10px rgba(116,231,241,.30));
  animation: flutuar 6s ease-in-out infinite;
}

.snoopy-decor:nth-child(1) { top: 1%; left: -4%; }
.snoopy-decor:nth-child(2) { top: 3%; right: -5%; width: clamp(145px,32vw,260px); }
.snoopy-decor:nth-child(3) { top: 39%; left: -8%; width: clamp(130px,30vw,245px); }
.snoopy-decor:nth-child(4) { top: 43%; right: -8%; width: clamp(130px,30vw,245px); }
.snoopy-decor:nth-child(5) { bottom: 1%; left: -4%; width: clamp(135px,30vw,245px); }
.snoopy-decor:nth-child(6) { bottom: 0; right: -5%; width: clamp(145px,32vw,260px); }

/* Letra da música */
#legenda {
  position: relative;
  z-index: 4;
  min-height: 125px;
  width: min(95%,800px);
  margin: 20px auto;
  padding: 12px 5px;
  color: #eaffff;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(24px,5.5vw,37px);
  font-weight: bold;
  line-height: 1.65;
  text-align: center;
  text-shadow:
    0 0 2px #fff,
    0 0 4px #b8faff,
    0 0 8px rgba(85,234,255,.55);
}

#legenda.animar {
  animation:
    entradaLetra .8s ease both,
    flutuarLetra 3s ease-in-out infinite .8s,
    neonSuave 3s ease-in-out infinite .8s;
}

@keyframes entradaLetra {
  0% { opacity: 0; filter: blur(4px); }
  100% { opacity: 1; filter: blur(0); }
}

@keyframes neonSuave {
  0%,100% {
    text-shadow: 0 0 2px #fff, 0 0 4px #b8faff, 0 0 8px rgba(85,234,255,.55);
  }
  50% {
    text-shadow: 0 0 3px #fff, 0 0 6px #b8faff, 0 0 11px rgba(85,234,255,.65);
  }
}

@keyframes flutuarLetra {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* ==================================
   NOVA APARÊNCIA DA PÁGINA INICIAL
   ================================== */

#siteHeader,
#heroSubtitle,
#menuPanel,
#homeMessage,
#siteFooter {
  display: none;
}

body.home #app {
  max-width: 1050px;
  min-height: 100vh;
  justify-content: flex-start;
  padding: 22px 18px 30px;
  gap: 0;
}

/* Cabeçalho */
body.home #siteHeader {
  display: block;
  width: 100%;
  margin-bottom: 24px;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 5px 4px 17px;
}

.brand-name {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: clamp(23px,5vw,38px);
  text-shadow: 0 0 7px #e9aaff, 0 0 17px #c52cff;
}

.brand-heart {
  color: #e9aaff;
  font-size: 34px;
  text-shadow: 0 0 12px #d32cff;
}

.brand-small {
  border: 2px solid #c52cff;
  border-radius: 30px;
  padding: 10px 13px;
  min-height: auto;
  background: rgba(42,0,65,.75);
  font-size: 13px;
  white-space: nowrap;
  box-shadow: 0 0 12px rgba(194,44,255,.55);
}

.site-nav {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 5px;
  padding: 7px;
  border: 2px solid #c52cff;
  border-radius: 23px;
  background: rgba(24,0,38,.82);
  box-shadow: 0 0 15px rgba(194,44,255,.55);
}

.site-nav button {
  min-height: 43px;
  padding: 7px 4px;
  border: none;
  border-radius: 13px;
  background: transparent;
  box-shadow: none;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(11px,2.7vw,16px);
  color: #f7ddff;
}

.site-nav button:hover {
  background: rgba(190,50,255,.18);
  box-shadow: 0 0 12px rgba(210,80,255,.35);
}

/* Apresentação */
body.home #pergunta {
  width: min(100%,720px);
  margin: 20px auto 15px;
  padding: 20px 15px;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: clamp(25px,5.5vw,39px);
  line-height: 1.35;
  border: 2px solid #c52cff;
  border-radius: 45px;
  background: rgba(27,0,43,.78);
  box-shadow: 0 0 18px #a52cff, inset 0 0 15px rgba(174,44,255,.12);
  text-shadow: 0 0 12px #e7aaff;
}

body.home #heroSubtitle {
  display: block;
  width: 100%;
  margin: 3px auto 22px;
  color: #f2caff;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: clamp(17px,4vw,25px);
  text-shadow: 0 0 10px #c52cff;
}

.heart-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 90%;
  margin: 12px auto 24px;
  color: #e8aaff;
  font-size: 35px;
  text-shadow: 0 0 12px #c52cff;
}

.heart-divider::before,
.heart-divider::after {
  content: "";
  height: 2px;
  flex: 1;
  background: linear-gradient(90deg,transparent,#d83cff,transparent);
  box-shadow: 0 0 9px #d83cff;
}

/* Painel do menu */
body.home #menuPanel {
  display: block;
  width: 100%;
  padding: 18px 17px 20px;
  margin: 0 auto 25px;
  border: 2px solid #c52cff;
  border-radius: 35px;
  background: rgba(25,0,39,.79);
  box-shadow: 0 0 17px rgba(198,44,255,.7), inset 0 0 20px rgba(155,25,255,.10);
}

.menu-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 0 0 17px;
  color: #f4d9ff;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: clamp(20px,4.5vw,30px);
  text-shadow: 0 0 12px #d45aff;
}

.menu-heading span {
  font-size: 26px;
  color: #d94cff;
}

body.home #opcoes {
  width: 100%;
  max-width: none;
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 15px;
  margin: 0;
}

body.home #opcoes button {
  min-height: 92px;
  padding: 13px 10px;
  border: 2px solid #c52cff;
  border-radius: 30px;
  background: rgba(55,5,91,.80);
  box-shadow: 0 0 12px rgba(190,35,255,.45);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(15px,3.5vw,21px);
  line-height: 1.35;
  text-shadow: 0 0 8px rgba(235,190,255,.35);
}

body.home #opcoes button:hover {
  transform: translateY(-3px);
  background: rgba(91,12,130,.92);
  box-shadow: 0 0 20px rgba(213,44,255,.8);
}

/* Mensagem especial */
body.home #homeMessage {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  margin: 12px auto 24px;
  padding: 16px;
  border: 2px solid #b72cff;
  border-radius: 32px;
  background: rgba(31,0,48,.84);
  box-shadow: 0 0 16px rgba(190,35,255,.55);
}

.home-snoopy {
  flex: 0 0 34%;
  max-width: 170px;
  height: 145px;
  object-fit: contain;
  filter: drop-shadow(0 0 9px rgba(211,75,255,.55));
  animation: flutuar 3.5s ease-in-out infinite;
}

.home-message-text {
  flex: 1;
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
}

.home-message-text h2 {
  margin: 0 0 9px;
  color: #f6dfff;
  font-size: clamp(19px,4vw,27px);
  text-shadow: 0 0 10px #d45aff;
}

.home-message-text p {
  margin: 0;
  color: #e8c9ff;
  font-style: italic;
  font-size: clamp(14px,3.5vw,19px);
  line-height: 1.6;
}

/* Rodapé */
body.home #siteFooter {
  display: block;
  width: 100%;
  padding: 5px 10px 12px;
  color: #e9baff;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: 18px;
  line-height: 1.8;
  text-shadow: 0 0 10px #c52cff;
}

body.home #siteFooter .paw {
  margin: 0 14px;
  font-size: 25px;
}

/* Ajustes nas telas internas */
body:not(.home) #siteHeader,
body:not(.home) #heroSubtitle,
body:not(.home) #menuPanel,
body:not(.home) #homeMessage,
body:not(.home) #siteFooter {
  display: none !important;
}

body:not(.home) #app {
  justify-content: center;
}

/* Responsividade */
@media (max-width:600px) {
  body { background-attachment: scroll; }

  #app { padding: 35px 16px; }

  h1 { margin-bottom: 30px; }

  .foto-fundo {
    width: 43vw;
    height: 155px;
    border-radius: 17px;
    opacity: .72;
  }

  .foto-fundo:nth-child(1) { top: 5%; left: 1%; }
  .foto-fundo:nth-child(2) { top: 7%; right: 1%; }
  .foto-fundo:nth-child(3) { top: 37%; left: -12%; }
  .foto-fundo:nth-child(4) { top: 39%; right: -12%; }
  .foto-fundo:nth-child(5) { bottom: 5%; left: 0; }
  .foto-fundo:nth-child(6) { bottom: 5%; right: 0; }

  .foto-fundo:nth-child(7) {
    top: 70%;
    left: 35%;
    width: 35vw;
    height: 130px;
  }

  #mensagem {
    width: 94%;
    font-size: 20px;
    line-height: 1.65;
    padding: 10px 4px;
    margin: 25px auto;
  }

  .snoopy-decor:nth-child(1) { top: 2%; left: -10%; }
  .snoopy-decor:nth-child(2) { top: 3%; right: -10%; }
  .snoopy-decor:nth-child(3) { top: 40%; left: -13%; }
  .snoopy-decor:nth-child(4) { top: 44%; right: -13%; }
  .snoopy-decor:nth-child(5) { bottom: 1%; left: -10%; }
  .snoopy-decor:nth-child(6) { bottom: 1%; right: -10%; }

  #legenda {
    font-size: clamp(23px,5.8vw,32px);
    min-height: 120px;
    padding: 10px 5px;
  }

  body.talvez-vermelho #mensagem,
  body.talvez-laranja #mensagem {
    width: 96%;
    font-size: 17px;
    line-height: 1.7;
    padding: 13px;
    margin: 12px auto 20px;
  }

  body.talvez-vermelho h1,
  body.talvez-laranja h1 {
    font-size: 27px;
    margin-top: 10px;
  }

  /* Novo início no celular */
  body.home #app {
    padding: 18px 12px 25px;
  }

  body.home #siteHeader {
    margin-bottom: 17px;
  }

  .brand-row {
    padding-bottom: 13px;
  }

  .brand-name {
    font-size: clamp(20px,5vw,29px);
    gap: 6px;
  }

  .brand-heart {
    font-size: 27px;
  }

  .brand-small {
    padding: 9px 10px;
    font-size: 11px;
  }

  .site-nav {
    gap: 1px;
    padding: 5px;
  }

  .site-nav button {
    font-size: clamp(10px,2.6vw,13px);
    min-height: 40px;
  }

  body.home #pergunta {
    margin: 17px auto 12px;
    padding: 19px 13px;
    border-radius: 36px;
    font-size: clamp(24px,6vw,33px);
  }

<audio id="musica" src="musica.mp3" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const legenda = document.getElementById("legenda");
const opcoes = document.getElementById("opcoes");
const snoopy = document.getElementById("snoopy");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");
const musicaFilhos = document.getElementById("musicaFilhos");
const musicaIdiota = document.getElementById("musicaIdiota");
const musicaFim = document.getElementById("musicaFim");
const musicaSinceridade = document.getElementById("musicaSinceridade");
const musicaSinofato = document.getElementById("musicaSinofato");
const fundoFotos = document.getElementById("fundoFotos");

const todosAudios = [
  musica,
  musicaFilhos,
  musicaIdiota,
  musicaFim,
  musicaSinceridade,
  musicaSinofato
];

const fotos = {
  anakin: ["anakin.jpg","anakin1.jpg","anakin2.jpg","anakin3.jpg","anakin4.jpg","anakin5.jpg","anakin6.jpg"],
  cigana: ["cigana.jpg","cigana2.jpg","cigana3.jpg","cigana4.jpg","cigana5.jpg","cigana6.jpg"],
  melissa: ["melissa.jpg","melissa2.jpg","melissa3.jpg","melissa4.jpg","melissa5.jpg"],
  nos: ["nos.png","nos2.png","nos3.png","nos4.jpg","nos5.jpg","nos6.jpg","nos7.jpg","nos8.jpg","nos9.jpg","nos10.jpg"]
};

const musicasDosFilhos = {
  anakin: "musicaanakin.mp3",
  melissa: "musicamelissa.mp3",
  cigana: "musicacigana.mp3",
  nos: "musicanos.mp3"
};

let digitacaoAtual = null;

function pararTodasMusicas() {
  todosAudios.forEach(audio => {
    audio.pause();
    audio.currentTime = 0;
  });

  musicaFim.ontimeupdate = null;
}

function tocar(audio) {
  pararTodasMusicas();

  audio.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });
}

function limpar() {
  clearInterval(digitacaoAtual);

  opcoes.innerHTML = "";
  snoopy.innerHTML = "";
  mensagem.textContent = "";
  legenda.textContent = "";
  legenda.classList.remove("animar");
  campo.value = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";
  fundoFotos.innerHTML = "";
  fundoFotos.classList.remove("ativo");
  pergunta.style.display = "block";
}

function botao(texto, acao) {
  const b = document.createElement("button");
  b.textContent = texto;
  b.onclick = acao;
  opcoes.appendChild(b);
}

function imagensSnoopy(nomes) {
  snoopy.innerHTML = "";

  nomes.forEach(nome => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Snoopy";
    snoopy.appendChild(img);
  });
}

function colocarFotos(lista) {
  fundoFotos.innerHTML = "";
  fundoFotos.classList.add("ativo");

  lista.forEach((nome, indice) => {
    const img = document.createElement("img");
    img.className = "foto-fundo";
    img.src = nome;
    img.alt = "Foto da nossa família";
    img.onerror = () => img.style.display = "none";
    img.style.animationDelay = (indice * .35) + "s";
    fundoFotos.appendChild(img);
  });
}

function digitar(texto, velocidade = 35) {
  clearInterval(digitacaoAtual);
  mensagem.textContent = "";
  let i = 0;

  digitacaoAtual = setInterval(() => {
    mensagem.textContent += texto.charAt(i);
    i++;

    if (i >= texto.length) {
      clearInterval(digitacaoAtual);
      digitacaoAtual = null;
    }
  }, velocidade);
}

function registrar(perguntaFeita, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({
      pergunta: perguntaFeita,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

function iniciar() {
  pararTodasMusicas();
  limpar();
  document.body.className = "home";

  pergunta.textContent = "Espero que goste independente das escolhas";

  botao("♡  Nossos filhos", () => {
    registrar(pergunta.textContent, "Nossos filhos");
    etapaFilhos();
  });

  botao("♡  NÃO, Acabou.", () => {
    registrar(pergunta.textContent, "NÃO, Acabou.");
    etapaNaoAcabou();
  });

  botao("♡  Por que você é assim Caralho?", () => {
    registrar(pergunta.textContent, "Por que você é assim Caralho?");
    etapaTalvez();
  });

  botao("♡  Amo muito e ainda te quero.", () => {
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });
}

function etapaFilhos() {
  pararTodasMusicas();
  limpar();
  document.body.className = "";

  pergunta.textContent = "Nossos filhos ❤️";

  botao("🖤 Anakin", () => {
    registrar("Nossos filhos", "Anakin");
    etapaPet("anakin");
  });

  botao("💜 Melissa", () => {
    registrar("Nossos filhos", "Melissa");
    etapaPet("melissa");
  });

  botao("🧡 Cigana", () => {
    registrar("Nossos filhos", "Cigana");
    etapaPet("cigana");
  });

  botao("🖤 Nossa família", () => {
    registrar("Nossos filhos", "Nossa família");
    etapaPet("nos");
  });
}

function etapaPet(tipo) {
  limpar();
  document.body.className = tipo;
  colocarFotos(fotos[tipo]);

  musicaFilhos.src = musicasDosFilhos[tipo];
  tocar(musicaFilhos);

  const textos = {
    anakin: [
      "Nosso querido Anakin 🖤",
      "E em meio ao pouco caos que estávamos em casa com as duas idosas, chegou um capetinha, ou melhor, um porcarinhazinha para agitar e animar nossa vida, o nosso querido filho Anakin que dorme com nós, nos perturba, pula nas nossas calças e vive miando por comida igual um desesperado. Nosso lindo filho Anakin 🖤"
    ],
    melissa: [
      "Nossa linda Melissa Mel 💜",
      "Esse aqui é a mais manhosa, ansiosa igual ao pai e observadora igual a mãe. Antes mesmo de eu chegar na sua vida, ela já era seu mundo, apenas sou um planeta do sistema solar que continuará dando sentido ao mesmo universo que vc ama. Nossa linda e bela Melissa Mel 💜"
    ],
    cigana: [
      "Nossa querida Cigana 🧡",
      "Lembro como se fosse ontem o trabalho para gente conseguir adotar ela, colocar ela dentro de casa, fazer ela comer ração, fazer ela ficar dentro de casa, fora as garras dela que rasgou o nosso colchão de ar novinho kkkkkkk. Ela é nossa filha mais senhora de alma, onde é preguiçosa, come e dorme além de se irritar fácil com agitação do Anakin. Nossa linda bola de pelo laranja."
    ],
    nos: [
      "Nossa família 🖤🧡",
      "Aqui estamos nós, a nossa família reunida, cada um de nós somos um planeta nesse universo enquanto VOCÊ Sarah Isabel, é o sol que ilumina a nossa existência. Graças a vc estamos todos ligados diretamente e somos uma família um pouco caótica mas muito feliz e amorosa. Amo muito você, igual amo cada um dos nossos filhos.\n\nE é claro, a nossa Diana terá lindas irmãs e um irmão capeta."
    ]
  };

  pergunta.textContent = textos[tipo][0];
  mensagem.textContent = textos[tipo][1];

  botao("Voltar à escolha dos filhos ❤️", etapaFilhos);
}

function criarLuvinha() {
  return '<span class="luvinha" aria-hidden="true">🧤</span>';
}

function etapaNaoAcabou() {
  pararTodasMusicas();
  limpar();
  document.body.className = "fim-ciano";
  pergunta.style.display = "none";

  const botaoUm = document.createElement("button");
  botaoUm.innerHTML = criarLuvinha() + "Realmente acabou?";
  botaoUm.onclick = () => {
    registrar("NÃO, Acabou.", "Realmente acabou?");
    etapaRealmenteAcabou();
  };
  opcoes.appendChild(botaoUm);

  const botaoDois = document.createElement("button");
  botaoDois.innerHTML = criarLuvinha() + "Esse é o fim";
  botaoDois.onclick = () => {
    registrar("NÃO, Acabou.", "Esse é o fim");
    etapaEsseEFim();
  };
  opcoes.appendChild(botaoDois);
}

function etapaRealmenteAcabou() {
  pararTodasMusicas();
  limpar();
  document.body.className = "fim-ciano";
  pergunta.style.display = "none";

  const texto =
    "Eu sei muito bem o meu erro, eu nunca quis controlar suas finanças, nem ver os seus gastos, nem duvidar de vc. A questão é que meu lado tóxico é entregar tudo meu para você, te proporcionar o melhor material possível, só que isso é apenas e unicamente para você. Se for babaca, podre, ruim de minha parte isso não importa, não tinha nada que mais me irritava do que você ter que gastar com os outros algo que você suou para ter enquanto, e ao eu oferecer isso, queria um egocentrismo de você para você, como também queria que ser unicamente para você fosse valorizado.";

  digitar(texto, 38);
  tocar(musicaIdiota);
}

function mostrarVerso(texto) {
  legenda.classList.remove("animar");
  void legenda.offsetWidth;
  legenda.textContent = texto;
  legenda.classList.add("animar");
}

function etapaEsseEFim() {
  pararTodasMusicas();
  limpar();
  document.body.className = "fim-ciano";
  pergunta.style.display = "none";

  const versos = [
    {t: 0.0, texto: "Mas dessa vez eu já decidi"},
    {t: 3.5, texto: "Quero ver teus olhos ao dizer"},
    {t: 7.8, texto: "Tudo aquilo que eu só consegui"},
    {t: 11.7, texto: "Sentir com você"},
    {t: 15.0, texto: "E eu vou te esperar"},
    {t: 18.2, texto: "Aonde quer que eu vá"},
    {t: 21.3, texto: "Aonde quer que eu vá"},
    {t: 24.1, texto: "Te levo comigo"},
    {t: 27.6, texto: "E eu vou te esperar"},
    {t: 30.8, texto: "Aonde quer que eu vá"},
    {t: 34.0, texto: "Aonde quer que eu vá"},
    {t: 37.0, texto: "Te levo comigo"},
    {t: 40.3, texto: "E eu vou te esperar"},
    {t: 43.0, texto: "Aonde quer que eu vá"},
    {t: 45.2, texto: "Te levo comigo"}
  ];

  let versoAtual = -1;

  musicaFim.currentTime = 0;

  musicaFim.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  musicaFim.ontimeupdate = () => {
    const tempo = musicaFim.currentTime;
    let novoVerso = -1;

    for (let i = versos.length - 1; i >= 0; i--) {
      if (tempo >= versos[i].t) {
        novoVerso = i;
        break;
      }
    }

    if (novoVerso !== -1 && novoVerso !== versoAtual) {
      versoAtual = novoVerso;
      mostrarVerso(versos[novoVerso].texto);
    }
  };

  musicaFim.onended = () => {
    legenda.classList.remove("animar");
  };

  versoAtual = 0;
  mostrarVerso(versos[0].texto);
}

/* Menu da opção Por que você é assim */
function etapaTalvez() {
  pararTodasMusicas();
  limpar();
  document.body.className = "";

  pergunta.textContent = "Por que você é assim Caralho?";

  mensagem.textContent =
    "Não sei ao certo por que sou assim, dessa forma, dessa forma esquisita, estranha, orgulhosa e pouco falante.";

  botao("Quero sua sinceridade", () => {
    registrar("Por que você é assim Caralho?", "Quero sua sinceridade");
    etapaSinceridade();
  });

  botao("Quero só saber o que vc quer de fato", () => {
    registrar("Por que você é assim Caralho?", "Quero só saber o que vc quer de fato");
    etapaOQueQuer();
  });

  botao("Voltar às opções", iniciar);
}

function etapaSinceridade() {
  pararTodasMusicas();
  limpar();
  document.body.className = "talvez-vermelho";

  pergunta.textContent = "Quero sua sinceridade";

  tocar(musicaSinceridade);

  mensagem.textContent =
    "Peço desculpas pelas vezes que eu não consegui te entender, que não pensei na situação toda, além de que foi pouco empático ou 0 de empatia. Por tornar as coisas difíceis quando eu deveria torná-las mais fáceis ou ajudar como apoio sobre. Eu juro que realmente, todos os dias, eu pensava assim, pensava quando cozinhava para você, quando limpava para você não sentir um cheiro ruim mesmo eu morrendo de dor. Eu pensava em tornar mais fáceis e servir de apoio, eu não esperava que vc reconhecesse cada coisa que eu fizesse, apenas...que eu não me sentisse isolado, principalmente sobre vc ter pedido desculpas sobre não me defender na minha frente, da mesma forma que é vergonhoso para você fazer isso, que tinha vergonha de eu ver você assim sendo ignorante e briguenta com sua família, eu também tenho vergonha de falar que queria que fosse assim, e assim, e que eu fiz isso mas esperava um sorriso sobre isso ou um obrigado diretamente.\n\nSinto muito pelos momento que minhas emoções falaram mais alto e acabaram te machucando, quando você me bateu e mandou eu sair de casa, eu não questionei em nenhum momento essa decisão, mas dá mesma forma que suas emoções que eu causei, lhe fizeram me bater, é a mesma linha que eu chego no limite sobre tal coisa. Muita coisa aconteceu sobre, e eu estou cansado, assim como você, e eu não quero mais que você pense e fale com todos, queria que você olhasse mais para você mesma, como se só você importasse e nada além do seu redor, onde tudo é para você, da sua forma, do seu jeito, mas que eu tivesse noção sobre pois você falasse enquanto age para você unicamente.";

  botao("Voltar às opções", etapaTalvez);
}

function etapaOQueQuer() {
  pararTodasMusicas();
  limpar();
  document.body.className = "talvez-laranja";

  pergunta.textContent = "Quero só saber o que vc quer de fato";

  tocar(musicaSinofato);

  mensagem.textContent =
    "Eu só quero ir para longe, bem longe de tudo e todos, quando não podiam nem chegar na porta da nossa casa, eu nunca fiquei tão leve na minha vida, me lembrou o começo da gente em Pirangi, além de depois que suas irmas foram embora de lá, aquela leveza, sabe? Você tem seus problemas onde são só seus, eu não me intrometo nisso, mas é impossível não sentir nenhum pingo de raiva quando te afetam diretamente e mudam até o seu humor. Eu só quero ir para longe com você e nossos filhos, só quero ter que acordar 6horas da manhã num frio de -14 graus para tirar a neve da porta de casa. Só quero ter que aprender a trocar pneus normais para pneus de neve porque no Canadá é lei. \"O que eu queria era te levar daqui para nunca mais...\", eu já ouvi que eu não servia para te fazer feliz, que eu como o seu juízo, eu nunca concordei com isso, que eu faço você perder a linha? Sim, mas sempre quando foi só nós diretamente, sem nenhum família meu ou seu, eu quero essa paz, essa leveza, essa vida de eu e você sem família intrometida.";

  botao("Voltar às opções", etapaTalvez);
}

function etapaGravidez() {
  pararTodasMusicas();
  limpar();
  document.body.className = "";

  tocar(musica);
  pergunta.textContent = "Vc quer que esteja grávida?";

  botao("♡  Sim, quero muito", () => {
    registrar(pergunta.textContent, "Sim, quero muito");
    etapaFinal();
  });

  botao("♡  Não.", () => {
    registrar(pergunta.textContent, "Não");
    pararTodasMusicas();
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

function etapaFinal() {
  pararTodasMusicas();
  limpar();
  document.body.className = "";

  pergunta.textContent = "❤️";

  mensagem.textContent =
    "Então se cuide direito, coma por duas, beba água por duas, tenha cuidado mental por duas. Estarei indo cuidar de você e cuidar da Diana, errei em muitas coisas, eu sei, mas também sei o quão te amo e o quanto quero que você seja a mãe da Diana, pois uma bebezinha com o seu rosto será tão perfeita quanto você. E vc será a mais incrível desse mundo enquanto cuidamos dela desde cedo para irmos pro Canadá. Então, se cuidar pelas duas e me espere que estou indo.";

  imagensSnoopy([
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png"
  ]);
}

iniciar();
</script>
