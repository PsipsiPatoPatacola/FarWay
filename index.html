
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ❤️</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  background: #170522 url("./fundo-snoopy.png?v=3") center/cover fixed;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
  transition: background .7s;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(15,0,25,.22);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 1000px;
  min-height: 100vh;
  margin: auto;
  padding: 45px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  position: relative;
  z-index: 3;
  width: min(100%,720px);
  padding: 20px 16px;
  margin: 15px 0 40px;
  font-size: clamp(27px,6vw,43px);
  line-height: 1.3;
  background: rgba(25,0,40,.72);
  border: 2px solid #a52cff;
  border-radius: 30px;
  box-shadow: 0 0 18px #9c27ff;
  text-shadow: 0 0 12px #d66aff;
}

#mensagem {
  position: relative;
  z-index: 3;
  width: min(92%,780px);
  padding: 12px;
  margin: 25px auto;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(19px,4.5vw,26px);
  line-height: 1.65;
  color: white;
  text-align: center;
  white-space: pre-line;
  background: transparent;
  border: none;
  box-shadow: none;
  text-shadow: 0 2px 5px #000, 0 0 12px rgba(0,0,0,.95);
}

#mensagem:empty { display: none; }

#opcoes {
  position: relative;
  z-index: 4;
  width: min(100%,620px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0 auto 20px;
}

button {
  border: 2px solid #cf36ff;
  border-radius: 25px;
  padding: 16px 18px;
  min-height: 66px;
  font-size: clamp(17px,4vw,23px);
  color: white;
  background: rgba(55,5,91,.91);
  box-shadow: 0 0 12px rgba(190,35,255,.65);
  cursor: pointer;
  transition: .25s;
}

button:hover {
  transform: scale(1.02);
  box-shadow: 0 0 22px #d52cff;
}

#campo {
  position: relative;
  z-index: 4;
  width: min(100%,550px);
  min-height: 140px;
  padding: 14px;
  border: 2px solid #c52cff;
  border-radius: 15px;
  background: rgba(255,255,255,.96);
  color: #24102d;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  margin-bottom: 15px;
}

#enviarTexto, #status {
  position: relative;
  z-index: 4;
}

#status {
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 5px black;
}

/* Fotos dos bichinhos no fundo */
#fundoFotos {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
  display: none;
}

#fundoFotos.ativo { display: block; }

.foto-fundo {
  position: absolute;
  width: clamp(175px,39vw,350px);
  height: clamp(145px,31vw,270px);
  object-fit: cover;
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,.35);
  opacity: .76;
  box-shadow: 0 0 25px rgba(255,255,255,.18);
  animation: flutuar 5s ease-in-out infinite;
}

@keyframes flutuar {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-13px) rotate(3deg); }
}

.foto-fundo:nth-child(1) { top: 4%; left: 2%; }
.foto-fundo:nth-child(2) { top: 5%; right: 2%; }
.foto-fundo:nth-child(3) { top: 34%; left: -5%; }
.foto-fundo:nth-child(4) { top: 35%; right: -5%; }
.foto-fundo:nth-child(5) { bottom: 5%; left: 3%; }
.foto-fundo:nth-child(6) { bottom: 4%; right: 3%; }
.foto-fundo:nth-child(7) {
  top: 68%;
  left: 36%;
  width: clamp(150px,30vw,260px);
  height: clamp(125px,25vw,210px);
}

/* Snoopy */
#snoopy {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(85px,1fr));
  gap: 10px;
  width: 100%;
  margin: 15px 0;
}

#snoopy:empty { display: none; }

#snoopy img {
  width: 100%;
  height: 115px;
  object-fit: contain;
  animation: flutuar 3s ease-in-out infinite;
  filter: drop-shadow(0 0 7px rgba(194,60,255,.55));
}

/* Cores antigas */
body.anakin { background: #171717; }
body.anakin::before { background: rgba(0,0,0,.30); }

body.melissa { background: #27083d; }
body.melissa::before { background: rgba(35,0,55,.28); }

body.cigana { background: #542000; }
body.cigana::before { background: rgba(65,25,0,.30); }

body.nos { background: #171313; }
body.nos::before { background: rgba(30,12,0,.30); }

body.vermelho { background: #650b24; }
body.vermelho::before { background: rgba(70,0,20,.66); }

body.anakin h1 {
  border-color: #777;
  box-shadow: 0 0 18px rgba(255,255,255,.2);
  background: rgba(0,0,0,.65);
}

body.melissa h1 { border-color: #d52cff; }

body.cigana h1 {
  border-color: #ff9a32;
  box-shadow: 0 0 18px #ff7b00;
  background: rgba(65,25,0,.75);
}

body.nos h1 {
  border-color: #ff8a28;
  box-shadow: 0 0 18px #ff7b00;
  background: rgba(0,0,0,.72);
}

/* NOVA PARTE: ciano e cinza */
body.ciano {
  background: #263238;
}

body.ciano::before {
  background: rgba(8,20,25,.48);
}

body.ciano h1 {
  background: rgba(20,35,42,.78);
  border-color: #80deea;
  box-shadow: 0 0 22px rgba(128,222,234,.65);
  color: #eafcff;
  text-shadow: 0 0 12px #80deea;
}

body.ciano #mensagem {
  color: #eafcff;
  font-family: "Trebuchet MS", Arial, sans-serif;
  text-shadow: 0 2px 7px #000, 0 0 12px rgba(128,222,234,.35);
}

body.ciano button {
  background: rgba(35,65,75,.88);
  border-color: #80deea;
  box-shadow: 0 0 15px rgba(128,222,234,.4);
}

body.ciano #snoopy img {
  filter: drop-shadow(0 0 9px rgba(128,222,234,.8));
}

/* Fotos decorativas diferentes na parte ciano */
body.ciano #snoopy {
  grid-template-columns: repeat(3,1fr);
  gap: 18px;
}

body.ciano #snoopy img:nth-child(2n) {
  transform: translateY(20px) rotate(8deg);
}

body.ciano #snoopy img:nth-child(2n+1) {
  transform: translateY(-8px) rotate(-7deg);
}

/* Mãozinha das escolhas */
.maozinha {
  display: inline-block;
  margin-right: 10px;
  font-size: 27px;
  animation: apontar 1s ease-in-out infinite;
}

@keyframes apontar {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

/* Área da música e legendas */
#areaLetra {
  position: relative;
  z-index: 5;
  width: min(94%,760px);
  min-height: 150px;
  margin: 20px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

#legenda {
  color: white;
  font-family: Georgia, serif;
  font-size: clamp(23px,5.5vw,36px);
  line-height: 1.5;
  font-weight: bold;
  text-shadow:
    0 2px 5px #000,
    0 0 15px #d58cff,
    0 0 25px #8b36ff;
  opacity: 0;
  transition: opacity .35s;
}

#legenda.visivel { opacity: 1; }

body.musica-final {
  background: #130b20;
}

body.musica-final::before {
  background: rgba(8,4,15,.55);
}

body.musica-final h1 {
  border-color: #c18cff;
  background: rgba(25,10,40,.75);
  box-shadow: 0 0 20px #9c65d6;
}

body.musica-final button {
  border-color: #c18cff;
  background: rgba(48,20,70,.9);
}

@media (max-width:600px) {
  body { background-attachment: scroll; }

  #app { padding: 35px 16px; }

  h1 { margin-bottom: 30px; }

  .foto-fundo {
    width: 46vw;
    height: 165px;
    border-radius: 17px;
    opacity: .72;
  }

  .foto-fundo:nth-child(1) { top: 5%; left: 1%; }
  .foto-fundo:nth-child(2) { top: 7%; right: 1%; }
  .foto-fundo:nth-child(3) { top: 37%; left: -12%; }
  .foto-fundo:nth-child(4) { top: 39%; right: -12%; }
  .foto-fundo:nth-child(5) { bottom: 5%; left: 0; }
  .foto-fundo:nth-child(6) { bottom: 5%; right: 0; }
  .foto-fundo:nth-child(7) {
    top: 70%;
    left: 35%;
    width: 38vw;
    height: 140px;
  }

  #mensagem {
    width: 94%;
    font-size: 20px;
    line-height: 1.65;
    padding: 10px 4px;
    margin: 25px auto;
  }

  body.ciano #snoopy {
    grid-template-columns: repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div id="fundoFotos"></div>

<div id="app">
  <h1 id="pergunta">Espero que goste independente das escolhas</h1>

  <div id="snoopy"></div>
  <p id="mensagem"></p>

  <div id="opcoes"></div>

  <textarea id="campo"
    placeholder="Escreva sua resposta..."
    style="display:none"></textarea>

  <button id="enviarTexto" style="display:none">
    Enviar resposta
  </button>

  <div id="areaLetra">
    <div id="legenda"></div>
  </div>

  <p id="status"></p>
</div>

<audio id="musica" src="musica.mp3" preload="auto"></audio>
<audio id="musicaFilhos" preload="auto"></audio>
<audio id="musicaNao" src="idiota.mp3" preload="auto"></audio>
<audio id="musicaFim" src="musicalevocomigo.mp3" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const opcoes = document.getElementById("opcoes");
const snoopy = document.getElementById("snoopy");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");
const musicaFilhos = document.getElementById("musicaFilhos");
const musicaNao = document.getElementById("musicaNao");
const musicaFim = document.getElementById("musicaFim");
const fundoFotos = document.getElementById("fundoFotos");
const legenda = document.getElementById("legenda");

const fotos = {
  anakin: [
    "anakin.jpg", "anakin1.jpg", "anakin2.jpg",
    "anakin3.jpg", "anakin4.jpg", "anakin5.jpg",
    "anakin6.jpg"
  ],
  cigana: [
    "cigana.jpg", "cigana2.jpg", "cigana3.jpg",
    "cigana4.jpg", "cigana5.jpg", "cigana6.jpg"
  ],
  melissa: [
    "melissa.jpg", "melissa2.jpg", "melissa3.jpg",
    "melissa4.jpg", "melissa5.jpg"
  ],
  nos: [
    "nos.png", "nos2.png", "nos3.png",
    "nos4.jpg", "nos5.jpg", "nos6.jpg",
    "nos7.jpg", "nos8.jpg", "nos9.jpg", "nos10.jpg"
  ]
};

const musicasDosFilhos = {
  anakin: "musicaanakin.mp3",
  melissa: "musicamelissa.mp3",
  cigana: "musicacigana.mp3",
  nos: "musicanos.mp3"
};

const textoRealmenteAcabou =
"Eu sei muito bem o meu erro, eu nunca quis controlar suas finanças, nem ver os seus gastos, nem duvidar de vc. A questão é que meu lado tóxico é entregar tudo meu para você, te proporcionar o melhor material possível, só que isso é apenas e unicamente para você. Se for babaca, podre, ruim de minha parte isso não importa, não tinha nada que mais me irritava do que você ter que gastar com os outros algo que você suou para ter enquanto, e ao eu oferecer isso, queria um egocentrismo de você para você, como também queria que ser unicamente para você fosse valorizado.";

let temporizadorDigitacao = null;
let indiceDigitacao = 0;
let textoDigitando = "";

/* Legendas: segundos iniciais estimados.
   Depois do primeiro teste, podemos ajustar os tempos. */
const trechosMusica = [
  { tempo: 0.0, texto: "Mas dessa vez eu já decidi" },
  { tempo: 4.0, texto: "Quero ver teus olhos ao dizer..." },
  { tempo: 8.0, texto: "Tudo aquilo que eu só consegui sentir com você" },
  { tempo: 14.0, texto: "E eu vouoou te esperar..." },
  { tempo: 18.0, texto: "Aonde quer que eu váááá" },
  { tempo: 22.0, texto: "Aonde quer que eu váááá" },
  { tempo: 26.0, texto: "Te levo comigo" },
  { tempo: 31.0, texto: "E eu vouoou te esperar..." },
  { tempo: 35.0, texto: "Aonde quer que eu váááá" },
  { tempo: 39.0, texto: "Aonde quer que eu váááá" },
  { tempo: 43.0, texto: "Te levo comigo" }
];

let ultimaLegenda = -1;

function pararTodasMusicas() {
  [musica, musicaFilhos, musicaNao, musicaFim].forEach(audio => {
    audio.pause();
    audio.currentTime = 0;
  });
}

function pararDigitacao() {
  if (temporizadorDigitacao) {
    clearInterval(temporizadorDigitacao);
    temporizadorDigitacao = null;
  }
}

function esconderLegenda() {
  legenda.textContent = "";
  legenda.classList.remove("visivel");
  ultimaLegenda = -1;
}

function limpar() {
  pararDigitacao();
  opcoes.innerHTML = "";
  snoopy.innerHTML = "";
  mensagem.textContent = "";
  campo.value = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";
  fundoFotos.innerHTML = "";
  fundoFotos.classList.remove("ativo");
  esconderLegenda();
  document.getElementById("areaLetra").style.display = "none";
}

function botao(texto, acao) {
  const b = document.createElement("button");
  b.textContent = texto;
  b.onclick = acao;
  opcoes.appendChild(b);
}

function botaoComMao(texto, acao) {
  const b = document.createElement("button");

  const mao = document.createElement("span");
  mao.className = "maozinha";
  mao.textContent = "👆";

  b.appendChild(mao);
  b.appendChild(document.createTextNode(texto));
  b.onclick = acao;
  opcoes.appendChild(b);
}

function registrar(perguntaFeita, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      pergunta: perguntaFeita,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

function imagensSnoopy(nomes) {
  snoopy.innerHTML = "";

  nomes.forEach(nome => {
    const img = document.createElement("img");
    img.src = nome;
    img.alt = "Snoopy";
    snoopy.appendChild(img);
  });
}

function colocarFotos(lista) {
  fundoFotos.innerHTML = "";
  fundoFotos.classList.add("ativo");

  lista.forEach((nome, indice) => {
    const img = document.createElement("img");
    img.className = "foto-fundo";
    img.src = nome;
    img.alt = "Foto da nossa família";
    img.onerror = () => { img.style.display = "none"; };
    img.style.animationDelay = (indice * .35) + "s";
    fundoFotos.appendChild(img);
  });
}

function tocarMusicaFilho(tipo) {
  pararTodasMusicas();
  musicaFilhos.src = musicasDosFilhos[tipo];
  musicaFilhos.load();

  musicaFilhos.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });
}

function iniciar() {
  pararTodasMusicas();
  document.body.className = "";
  limpar();

  pergunta.textContent = "Espero que goste independente das escolhas";

  botao("♡  Nossos filhos", () => {
    registrar(pergunta.textContent, "Nossos filhos");
    etapaFilhos();
  });

  botao("♡  NÃO, Acabou.", () => {
    registrar(pergunta.textContent, "NÃO, Acabou.");
    etapaNao();
  });

  botao("♡  Talvez.", () => {
    registrar(pergunta.textContent, "Talvez");
    etapaTalvez();
  });

  botao("♡  Amo muito e ainda te quero.", () => {
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });
}

/* FILHOS */
function etapaFilhos() {
  pararTodasMusicas();
  limpar();
  document.body.className = "";

  pergunta.textContent = "Nossos filhos ❤️";

  botao("🖤 Anakin", () => {
    registrar("Nossos filhos", "Anakin");
    etapaPet("anakin");
  });

  botao("💜 Melissa", () => {
    registrar("Nossos filhos", "Melissa");
    etapaPet("melissa");
  });

  botao("🧡 Cigana", () => {
    registrar("Nossos filhos", "Cigana");
    etapaPet("cigana");
  });

  botao("🖤 Nossa família", () => {
    registrar("Nossos filhos", "Nossa família");
    etapaPet("nos");
  });
}

function etapaPet(tipo) {
  limpar();
  document.body.className = tipo;

  colocarFotos(fotos[tipo]);
  tocarMusicaFilho(tipo);

  if (tipo === "anakin") {
    pergunta.textContent = "Nosso querido Anakin 🖤";
    mensagem.textContent =
      "E em meio ao pouco caos que estávamos em casa com as duas idosas, chegou um capetinha, ou melhor, um porcarinhazinha para agitar e animar nossa vida, o nosso querido filho Anakin que dorme com nós, nos perturba, pula nas nossas calças e vive miando por comida igual um desesperado. Nosso lindo filho 🖤";
  }

  if (tipo === "melissa") {
    pergunta.textContent = "Nossa linda Melissa Mel 💜";
    mensagem.textContent =
      "Esse aqui é a mais manhosa, ansiosa igual ao pai e observadora igual a mãe. Antes mesmo de eu chegar na sua vida, ela já era seu mundo, apenas sou um planeta do sistema solar que continuará dando sentido ao mesmo universo que vc ama. Nossa linda e bela Melissa Mel 💜";
  }

  if (tipo === "cigana") {
    pergunta.textContent = "Nossa querida Cigana 🧡";
    mensagem.textContent =
      "Lembro como se fosse ontem o trabalho para gente conseguir adotar ela, colocar ela dentro de casa, fazer ela comer ração, fazer ela ficar dentro de casa, fora as garras dela que rasgou o nosso colchão de ar novinho kkkkkkk ela é nossa filha mais senhora de alma, onde é preguiçosa, come e dorme além de se irritar fácil com agitação do Anakin. Nossa linda bola de pelo laranja que o melhor fato, é vc ser a mãe dela e quis adotar ela cmg mesmo ela sendo mais de idade";
  }

  if (tipo === "nos") {
    pergunta.textContent = "Nossa família 🖤🧡";
    mensagem.textContent =
      "Aqui estamos nós, a nossa família reunida, cada um de nós somos um planeta nesse universo enquanto VOCÊ Sarah Isabel, é o sol que ilumina a nossa existência. Graças a vc estamos todos ligados diretamente e somos uma família um pouco caótica mas muito feliz e amorosa. Amo muito você, igual amo cada um dos nossos filhos.\n\nE é claro, a nossa Diana terá lindas irmãs e um irmão capeta";
  }

  botao("Voltar à escolha dos filhos ❤️", etapaFilhos);
}

/* NOVA PARTE: NÃO, ACABOU */
function etapaNao() {
  pararTodasMusicas();
  limpar();
  document.body.className = "ciano";

  pergunta.textContent = "NÃO, Acabou.";

  mensagem.textContent =
    "Antes de ir, quero que escolha uma última coisa...";

  botaoComMao("Realmente acabou?", () => {
    registrar("NÃO, Acabou.", "Realmente acabou?");
    etapaRealmenteAcabou();
  });

  botaoComMao("Esse é o fim.", () => {
    registrar("NÃO, Acabou.", "Esse é o fim");
    etapaEsseEoFim();
  });
}

/* TEXTO SENDO DIGITADO */
function digitarTexto(texto) {
  pararDigitacao();
  mensagem.textContent = "";
  textoDigitando = texto;
  indiceDigitacao = 0;

  temporizadorDigitacao = setInterval(() => {
    if (indiceDigitacao < textoDigitando.length) {
      mensagem.textContent += textoDigitando.charAt(indiceDigitacao);
      indiceDigitacao++;
    } else {
      pararDigitacao();
    }
  }, 38);
}

function etapaRealmenteAcabou() {
  pararTodasMusicas();
  limpar();
  document.body.className = "ciano";

  pergunta.textContent = "Realmente acabou?";

  imagensSnoopy([
    "snoopy-coracao-2.png",
    "snoopy-cama.png",
    "snoopy-coracao-4.png",
    "snoopy-coracao.png",
    "snoopy-cozinhando.png",
    "snoopy-louca.png"
  ]);

  musicaNao.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  digitarTexto(textoRealmenteAcabou);

  botao("Voltar ❤️", etapaNao);
}

/* MÚSICA COM LEGENDAS */
function etapaEsseEoFim() {
  pararTodasMusicas();
  limpar();
  document.body.className = "musica-final";

  pergunta.textContent = "Esse é o fim.";

  mensagem.textContent =
    "Te levo comigo. ❤️";

  document.getElementById("areaLetra").style.display = "flex";

  musicaFim.currentTime = 0;
  musicaFim.play().catch(() => {
    status.textContent = "Toque no botão para iniciar a música.";
  });

  musicaFim.ontimeupdate = atualizarLegenda;

  botao("Voltar ❤️", () => {
    musicaFim.pause();
    musicaFim.ontimeupdate = null;
    etapaNao();
  });
}

function atualizarLegenda() {
  const tempo = musicaFim.currentTime;

  let trechoAtual = -1;

  for (let i = 0; i < trechosMusica.length; i++) {
    if (tempo >= trechosMusica[i].tempo) {
      trechoAtual = i;
    }
  }

  if (trechoAtual !== ultimaLegenda) {
    ultimaLegenda = trechoAtual;

    if (trechoAtual >= 0) {
      legenda.textContent = trechosMusica[trechoAtual].texto;
      legenda.classList.add("visivel");
    } else {
      esconderLegenda();
    }
  }
}
