
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #170522 url("./fundo-snoopy.png") center center / cover fixed no-repeat;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
  transition: background 0.7s;
}

/* Escurecimento do fundo */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(15, 0, 25, 0.22);
  pointer-events: none;
  z-index: 1;
}

/* Brilhos decorativos */
body::after {
  content: "♡     ✦      ♥       ✧       ♡       ✦";
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-around;
  color: rgba(221, 90, 255, 0.45);
  font-size: 25px;
  text-shadow: 0 0 12px #d52cff, 0 0 24px #9d00ff;
  pointer-events: none;
  z-index: 1;
  animation: brilho 3s ease-in-out infinite alternate;
}

@keyframes brilho {
  from { opacity: 0.3; }
  to { opacity: 0.85; }
}

/* CAMADA DAS FOTOS NO FUNDO */
#decoracoes {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

#decoracoes img {
  position: absolute;
  width: clamp(100px, 23vw, 230px);
  height: clamp(100px, 23vw, 230px);
  object-fit: contain;
  opacity: 0.88;
  filter: drop-shadow(0 0 13px var(--brilho-foto));
  animation: flutuar 5s ease-in-out infinite;
}

#decoracoes img:nth-child(even) {
  animation-delay: 1.5s;
}

#decoracoes img:nth-child(3n) {
  animation-delay: 2.5s;
}

@keyframes flutuar {
  0%, 100% {
    transform: translateY(0) rotate(-4deg);
  }
  50% {
    transform: translateY(-13px) rotate(4deg);
  }
}

/* POSIÇÕES DAS FOTOS */
#decoracoes img:nth-child(1) {
  top: 2%;
  left: 1%;
}

#decoracoes img:nth-child(2) {
  top: 4%;
  right: 1%;
}

#decoracoes img:nth-child(3) {
  top: 34%;
  left: -3%;
}

#decoracoes img:nth-child(4) {
  top: 36%;
  right: -3%;
}

#decoracoes img:nth-child(5) {
  bottom: 3%;
  left: 2%;
}

#decoracoes img:nth-child(6) {
  bottom: 2%;
  right: 2%;
}

#decoracoes img:nth-child(7) {
  top: 65%;
  left: 38%;
  width: clamp(90px, 17vw, 170px);
  height: clamp(90px, 17vw, 170px);
}

/* CONTEÚDO PRINCIPAL */
#app {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 1000px;
  min-height: 100vh;
  margin: auto;
  padding: 45px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  width: min(100%, 720px);
  padding: 20px 16px;
  margin: 15px 0 45px;
  font-size: clamp(27px, 6vw, 43px);
  line-height: 1.3;
  background: rgba(31, 0, 53, 0.86);
  border: 2px solid var(--cor-borda);
  border-radius: 30px;
  box-shadow: 0 0 17px var(--cor-brilho),
              inset 0 0 14px rgba(160, 40, 255, 0.2);
  text-shadow: 0 0 12px var(--cor-brilho);
}

/* MENSAGENS */
#mensagem {
  position: relative;
  z-index: 4;
  width: min(100%, 760px);
  padding: 18px;
  margin: 10px auto 25px;
  font-size: clamp(18px, 4vw, 24px);
  line-height: 1.6;
  white-space: pre-line;
  background: rgba(12, 12, 12, 0.91);
  border: 1px solid var(--cor-borda);
  border-radius: 25px;
  text-align: left;
  text-shadow: 0 1px 5px black;
  box-shadow: 0 0 18px var(--cor-brilho);
}

#mensagem:empty {
  display: none;
}

/* POSIÇÃO DAS MENSAGENS NAS QUATRO OPÇÕES */
#mensagem.canto-anakin {
  position: fixed;
  top: 18px;
  left: 18px;
  width: min(46%, 520px);
  margin: 0;
}

#mensagem.canto-melissa {
  position: fixed;
  bottom: 18px;
  left: 18px;
  width: min(46%, 520px);
  margin: 0;
}

#mensagem.canto-cigana {
  position: fixed;
  top: 18px;
  right: 18px;
  width: min(46%, 520px);
  margin: 0;
}

#mensagem.canto-familia {
  position: fixed;
  bottom: 18px;
  right: 18px;
  width: min(46%, 520px);
  margin: 0;
}

/* BOTÕES */
#opcoes {
  position: relative;
  z-index: 5;
  width: min(100%, 620px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0 auto 20px;
}

button {
  border: 2px solid var(--cor-borda);
  border-radius: 25px;
  padding: 16px 18px;
  min-height: 66px;
  font-size: clamp(17px, 4vw, 23px);
  color: white;
  background: var(--cor-botao);
  box-shadow: 0 0 12px var(--cor-brilho),
              inset 0 0 10px rgba(255,255,255,0.08);
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  filter: brightness(1.3);
  transform: scale(1.02);
}

button:active {
  transform: scale(0.98);
}

/* CAMPO DE TEXTO */
#campo {
  position: relative;
  z-index: 5;
  width: min(100%, 550px);
  min-height: 140px;
  padding: 14px;
  border: 2px solid var(--cor-borda);
  border-radius: 15px;
  background: rgba(255,255,255,0.96);
  color: #24102d;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  margin-bottom: 15px;
}

#campo:empty {
  display: block;
}

/* CORES DE CADA ANIMAL */
body.tema-anakin {
  --cor-borda: #777777;
  --cor-brilho: #aaaaaa;
  --brilho-foto: #bdbdbd;
  --cor-botao: rgba(30,30,30,0.94);
  background: #191919;
}

body.tema-anakin::before {
  background: rgba(0,0,0,0.25);
}

body.tema-melissa {
  --cor-borda: #c52cff;
  --cor-brilho: #a52cff;
  --brilho-foto: #bd55ff;
  --cor-botao: rgba(55,5,91,0.94);
  background: #240033;
}

body.tema-cigana {
  --cor-borda: #ff9b36;
  --cor-brilho: #ff8a22;
  --brilho-foto: #ff9b36;
  --cor-botao: rgba(120,50,5,0.94);
  background: #542500;
}

body.tema-familia {
  --cor-borda: #ff9b36;
  --cor-brilho: #d66b20;
  --brilho-foto: #ff9b36;
  --cor-botao: rgba(35,20,15,0.95);
  background: #171313;
}

body.tema-familia::before {
  background: linear-gradient(
    120deg,
    rgba(0,0,0,0.55),
    rgba(110,45,5,0.30)
  );
}

/* OUTRAS TELAS */
.vermelho {
  background: #650b24 !important;
}

.vermelho::before {
  background: rgba(70,0,20,0.66);
}

#status {
  position: relative;
  z-index: 5;
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 5px black;
}

/* CELULAR */
@media (max-width: 600px) {
  body {
    background-attachment: scroll;
  }

  #app {
    padding: 35px 20px;
  }

  h1 {
    margin-bottom: 38px;
  }

  #decoracoes img {
    width: 34vw;
    height: 34vw;
    opacity: 0.82;
  }

  #decoracoes img:nth-child(3) {
    top: 40%;
  }

  #decoracoes img:nth-child(4) {
    top: 42%;
  }

  #decoracoes img:nth-child(7) {
    display: none;
  }

  #mensagem.canto-anakin,
  #mensagem.canto-melissa,
  #mensagem.canto-cigana,
  #mensagem.canto-familia {
    position: relative;
    top: auto;
    bottom: auto;
    left: auto;
    right: auto;
    width: 100%;
    margin: 10px auto 25px;
  }
}
</style>
</head>

<body>

<div id="decoracoes"></div>

<div id="app">
  <h1 id="pergunta">Espero que goste independente das escolhas</h1>

  <p id="mensagem"></p>

  <div id="opcoes"></div>

  <textarea id="campo"
    placeholder="Escreva sua resposta..."
    style="display:none"></textarea>

  <button id="enviarTexto" style="display:none">
    Enviar resposta
  </button>

  <p id="status"></p>
</div>

<audio id="musica" src="musica.mp3" preload="auto"></audio>

<script>
const ENDPOINT = "COLE_AQUI_O_LINK_DO_APPS_SCRIPT";

const pergunta = document.getElementById("pergunta");
const mensagem = document.getElementById("mensagem");
const opcoes = document.getElementById("opcoes");
const decoracoes = document.getElementById("decoracoes");
const campo = document.getElementById("campo");
const enviarTexto = document.getElementById("enviarTexto");
const status = document.getElementById("status");
const musica = document.getElementById("musica");

/* REGISTRO DE RESPOSTAS */
function registrar(perguntaFeita, resposta) {
  if (ENDPOINT.includes("COLE_AQUI")) return;

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      pergunta: perguntaFeita,
      resposta: resposta,
      data: new Date().toLocaleString("pt-BR")
    })
  }).catch(() => {});
}

/* LIMPA A TELA */
function limpar() {
  opcoes.innerHTML = "";
  decoracoes.innerHTML = "";
  mensagem.textContent = "";
  mensagem.className = "";
  campo.value = "";
  campo.style.display = "none";
  enviarTexto.style.display = "none";
  status.textContent = "";
}

/* CRIA BOTÕES */
function botao(texto, acao) {
  const b = document.createElement("button");
  b.textContent = texto;
  b.onclick = acao;
  opcoes.appendChild(b);
}

/*
  COLOCA AS FOTOS ESPALHADAS NO FUNDO.
  Elas ficam atrás das mensagens e dos botões.
*/
function fotosDeFundo(arquivos) {
  decoracoes.innerHTML = "";

  arquivos.forEach((arquivo) => {
    const img = document.createElement("img");
    img.src = arquivo;
    img.alt = "";
    img.loading = "eager";
    decoracoes.appendChild(img);
  });
}

/* TELA INICIAL */
function iniciar() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "Espero que goste independente das escolhas";

  botao("♡ Nossos filhos", () => {
    registrar(pergunta.textContent, "Nossos filhos");
    etapaFilhos();
  });

  botao("♡ Não.", () => {
    registrar(pergunta.textContent, "Não");
    limpar();
    pergunta.textContent = "Obrigado por responder.";
  });

  botao("♡ Talvez.", () => {
    registrar(pergunta.textContent, "Talvez");
    etapaTalvez();
  });

  botao("♡ Amo muito e ainda te quero.", () => {
    registrar(pergunta.textContent, "Amo muito e ainda te quero");
    etapaGravidez();
  });
}

/* ESCOLHA DOS FILHOS */
function etapaFilhos() {
  limpar();

  document.body.className = "";
  pergunta.textContent = "Quem vamos visitar primeiro? ❤️";

  botao("🖤 Anakin", () => {
    registrar(pergunta.textContent, "Anakin");
    etapaAnakin();
  });

  botao("💜 Melissa", () => {
    registrar(pergunta.textContent, "Melissa");
    etapaMelissa();
  });

  botao("🧡 Cigana", () => {
    registrar(pergunta.textContent, "Cigana");
    etapaCigana();
  });

  botao("🖤 Nossa família", () => {
    registrar(pergunta.textContent, "Nossa família");
    etapaFamilia();
  });
}

/* ANAKIN */
function etapaAnakin() {
  limpar();
  document.body.className = "tema-anakin";

  pergunta.textContent = "Nosso querido Anakin 🖤";

  mensagem.textContent =
    "E em meio ao pouco caos que estávamos em casa com as duas idosas, chegou um capetinha, ou melhor, um porcarinhazinha para agitar e animar nossa vida, o nosso querido filho Anakin que dorme com nós, nos perturba, pula nas nossas calças e vive miando por comida igual um desesperado. Nosso lindo filho 🖤";

  mensagem.className = "canto-anakin";

  fotosDeFundo([
    "anakin.jpg",
    "anakin1.jpg",
    "anakin2.jpg",
    "anakin3.jpg",
    "anakin4.jpg",
    "anakin5.jpg",
    "anakin6.jpg"
  ]);

  botao("Voltar aos nossos filhos ❤️", etapaFilhos);
}

/* MELISSA */
function etapaMelissa() {
  limpar();
  document.body.className = "tema-melissa";

  pergunta.textContent = "Nossa linda Melissa Mel 💜";

  mensagem.textContent =
    "Esse aqui é a mais manhosa, ansiosa igual ao pai e observadora igual a mãe. Antes mesmo de eu chegar na sua vida, ela já era seu mundo, apenas sou um planeta do sistema solar que continuará dando sentido ao mesmo universo que vc ama. Nossa linda e bela Melissa Mel 💜";

  mensagem.className = "canto-melissa";

  fotosDeFundo([
    "melissa.jpg",
    "melissa2.jpg",
    "melissa%203.jpg",
    "melissa4.jpg",
    "melissa5.jpg"
  ]);

  botao("Voltar aos nossos filhos ❤️", etapaFilhos);
}

/* CIGANA */
function etapaCigana() {
  limpar();
  document.body.className = "tema-cigana";

  pergunta.textContent = "Nossa querida Cigana 🧡";

  mensagem.textContent =
    "Lembro como se fosse ontem o trabalho para gente conseguir adotar ela, colocar ela dentro de casa, fazer ela comer ração, fazer ela ficar dentro de casa, fora as garras dela que rasgou o nosso colchão de ar novinho kkkkkkk ela é nossa filha mais senhora de alma, onde é preguiçosa, come e dorme além de se irritar fácil com agitação do Anakin. Nossa linda bola de pelo laranja que o melhor fato, é vc ser a mãe dela e quis adotar ela cmg mesmo ela sendo mais de idade.";

  mensagem.className = "canto-cigana";

  fotosDeFundo([
    "cigana.jpg",
    "cigana%202.jpg",
    "cigana3.jpg",
    "cigana4.jpg",
    "cigana5.jpg",
    "cigana6.jpg"
  ]);

  botao("Voltar aos nossos filhos ❤️", etapaFilhos);
}

/* FAMÍLIA */
function etapaFamilia() {
  limpar();
  document.body.className = "tema-familia";

  pergunta.textContent = "Nossa família 🧡";

  mensagem.textContent =
    "Aqui estamos nós, a nossa família reunida, cada um de nós somos um planeta nesse universo enquanto VOCÊ Sarah Isabel, é o sol que ilumina a nossa existência. Graças a vc estamos todos ligados diretamente e somos uma família um pouco caótica mas muito feliz e amorosa. Amo muito você, igual amo cada um dos nossos filhos.\n\nE é claro, a nossa Diana terá lindas irmãs e um irmão capeta.";

  mensagem.className = "canto-familia";

  fotosDeFundo([
    "nos.png",
    "nos2.png",
    "nos3.png",
    "nos4.jpg",
    "nos5.jpg",
    "nos6.jpg",
    "nos7.jpg",
    "nos8.jpg",
    "nos9.jpg",
    "nos10.jpg"
  ]);

  botao("Voltar aos nossos filhos ❤️", etapaFilhos);
}

/* TALVEZ */
function etapaTalvez() {
  limpar();
  document.body.className = "vermelho";

  pergunta.textContent =
    "Então o que vc quer exatamente e como devo agir?";

  mensagem.textContent =
    "Pois voltar para CG se necessário, eu realmente irei.";

  campo.style.display = "block";
  enviarTexto.style.display = "inline-block";

  enviarTexto.onclick = () => {
    const resposta = campo.value.trim();

    if (!resposta) {
      status.textContent = "Escreva sua resposta primeiro.";
      return;
    }

    registrar(pergunta.textContent, resposta);

    campo.style.display = "none";
    enviarTexto.style.display = "none";
    opcoes.innerHTML = "";

    pergunta.textContent = "Obrigado por me responder.";
    mensagem.textContent = resposta;
    status.textContent = "Resposta enviada ❤️";
  };
}

/* GRAVIDEZ */
function etapaGravidez() {
  limpar();
  document.body.className = "";

  musica.currentTime = 0;
  musica.play().catch(() => {
    status.textContent = "Toque na tela para iniciar a música.";
  });

  pergunta.textContent = "Vc quer que esteja grávida?";

  botao("♡ Sim, quero muito", () => {
    registrar(pergunta.textContent, "Sim, quero muito");
    etapaFinal();
  });

  botao("♡ Não.", () => {
    registrar(pergunta.textContent, "Não");
    musica.pause();
    limpar();
    pergunta.textContent = "Obrigado por responder ❤️";
  });
}

/* TELA FINAL DA DIANA */
function etapaFinal() {
  limpar();
  document.body.className = "";

  pergunta.textContent = "❤️";

  mensagem.textContent =
    "Então se cuide direito, coma por duas, beba água por duas, " +
    "tenha cuidado mental por duas. Estarei indo cuidar de você " +
    "e cuidar da Diana, errei em muitas coisas, eu sei, mas também " +
    "sei o quão te amo e o quanto quero que você seja a mãe da Diana, " +
    "pois uma bebezinha com o seu rosto será tão perfeita quanto você. " +
    "E vc será a mais incrível desse mundo enquanto cuidamos dela " +
    "desde cedo para irmos pro Canadá. Então, se cuidar pelas duas " +
    "e me espere que estou indo.";

  fotosDeFundo([
    "snoopy-cozinhando.png",
    "snoopy-louca.png",
    "snoopy-cama.png",
    "snoopy-coracao.png",
    "snoopy-coracao-1.png",
    "snoopy-coracao-2.png",
    "snoopy-coracao-3.png",
    "snoopy-coracao-4.png"
  ]);
}

iniciar();
</script>

</body>
</html>
